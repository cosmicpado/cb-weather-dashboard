<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 충청북도 기상·재난 상황판 아이콘 — 해+구름(구름조금). 365일 쓰는 화면이라 특정 재해(먹구름·번개·경고 세모) 대신
       평상시에도 어울리는 그림으로(2026-10-30). 지도.html 상단 로고와 같은 그림·같은 파랑(사이트 기본색 brand). 주의: XML 주석 안에는 하이픈 두 개를 쓰면 그림이 깨진다. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 24×24 그림을 가운데 384×384 로 (마스크 아이콘 안전영역 안) -->
  <g transform="translate(64 64) scale(16)">
    <g stroke="#fcd34d" stroke-width="1.5" stroke-linecap="round">
      <line x1="15.5" y1="1.6" x2="15.5" y2="3"/>
      <line x1="20.4" y1="3.6" x2="19.4" y2="4.6"/>
      <line x1="22.4" y1="8.5" x2="21" y2="8.5"/>
      <line x1="10.6" y1="3.6" x2="11.6" y2="4.6"/>
    </g>
    <circle cx="15.5" cy="8.5" r="3.8" fill="#fcd34d"/>
    <path d="M6.6 20.4h10.6a3.7 3.7 0 0 0 .2-7.4 5.3 5.3 0 0 0-10.2-.6 4 4 0 0 0-.6 8z" fill="#ffffff"/>
  </g>
</svg>
