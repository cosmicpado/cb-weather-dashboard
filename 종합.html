<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e4e8ef;--ink:#101828;--ink2:#4b5a74;--ink3:#5f6d85;--brand:#1d4ed8;
  --ok:#12805c;--okbg:#ecf8f2;--warn:#e8590c;--warnbg:#fff4e6;--sev:#d92d20;--sevbg:#fef0ef;--blue:#2563eb;--amb:#e0930a;--tl:#C75400;--nowc:#5E3790;--nowbg:rgba(255,122,47,.10);--wxs:#A86A00;--wxm:#4F63D6;--pre:#64748b;--eqy:#7A6400;
  /* 하천 상세 팝업(river-popup.js)이 쓰는 색 이름 */
  --surface:#fff;--surface2:#f3f7fc;--surface3:#eaf0f8;--border:#e4e9f2;--border2:#d3dbe9;--safe:#0a8058;--caution:#e0930a;--severe:#d42a2f;--severeSoft:#fbe3e3;--brandSoft:#eef3ff;
  /* 지도·팝업 바탕 */
  --mapFill:#eef1f6;--mapSel:#dbe7ff;--lbl:#101828;--lbl2:#344054;--soft:#f3f5f9;--msg:#eef4ff;--me:#eef3ff;--over:rgba(255,255,255,.95)}
/* 어두운 화면(☾) */
:root[data-theme="dark"]{--bg:#080d18;--card:#111a2c;--line:#26314c;--ink:#e9eef9;--ink2:#9fb0cf;--ink3:#8a9ab8;--brand:#4b8bf5;
  --ok:#34d399;--okbg:rgba(52,211,153,.12);--warn:#fb923c;--warnbg:rgba(251,146,60,.13);--sev:#f87171;--sevbg:rgba(248,113,113,.14);--blue:#60a5fa;--amb:#fbbf24;--tl:#FF9A3C;--nowc:#17AFAB;--nowbg:rgba(255,122,47,.10);--wxs:#FFB020;--wxm:#B7C4FF;--pre:#94a3b8;--eqy:#F2D53C;
  --surface:#111a2c;--surface2:#18233b;--surface3:#1e2a45;--border:#26314c;--border2:#354364;--safe:#34d399;--caution:#fbbf24;--severe:#ef4444;--severeSoft:rgba(239,68,68,.16);--brandSoft:rgba(75,139,245,.16);
  --mapFill:#1a2540;--mapSel:#1e3a6b;--lbl:#e9eef9;--lbl2:#b6c3dc;--soft:#0f1729;--msg:rgba(96,165,250,.12);--me:rgba(75,139,245,.16);--over:rgba(17,26,44,.95)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',system-ui,sans-serif;color:var(--ink);font-size:15px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1600px;margin:0 auto;padding:14px 20px 20px;display:flex;flex-direction:column;gap:14px}
/* 상단 */
.top{display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex:none}
.tt{font-weight:800;font-size:17px;white-space:nowrap}.tt em{font-style:normal;font-size:13.5px;font-weight:800;color:#b54708;background:var(--card)4e6;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.ts{font-size:14.5px;color:var(--ink3)}.ts.late{color:var(--sev);font-weight:800}
.home{margin-left:20px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font-weight:800;font-size:14.5px;font-family:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.home.on{background:var(--brand);border-color:var(--brand);color:#fff}
.room{display:none}   /* 휴대폰에서만 — 위 메뉴가 숨으므로 상황실로 가는 단추 */
.sel{margin-left:8px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:4px 6px 4px 12px}
.sel small{color:var(--ink3);font-weight:700;white-space:nowrap}
.sel select{border:0;background:transparent;font-weight:800;font-size:15px;font-family:inherit;color:var(--ink);padding:5px 4px;cursor:pointer}
.nav{margin-left:auto;display:flex;gap:4px;align-items:center}
/* 윗줄 정돈 — 왼쪽(이름) · 관서 선택 묶음 · 오른쪽(화면 이동 · 도구). 단추 높이는 모두 38px */
.home,.sel{height:38px;box-sizing:border-box}.home{display:inline-flex;align-items:center;padding:0 13px;margin-left:24px}.sel{margin-left:6px;padding:0 6px 0 12px}
.nav>a{height:38px;box-sizing:border-box;display:inline-flex;align-items:center}
.demo>button{height:38px;box-sizing:border-box}

/* 중간 폭(노트북·창 줄임) — 윗줄이 넘치면 메뉴·아이콘 묶음이 둘째 줄 오른쪽으로 내려간다(잘리지 않게) */
@media (min-width:821px) and (max-width:1500px){
  .top{flex-wrap:wrap;row-gap:8px}.home{margin-left:12px}
  .nav a{padding:8px 9px}
}
/* 날씨 칸이 좁으면(가운데·오른쪽 칸 폭이 줄 때) 휴대폰처럼 세로로 쌓고 예보 표는 칸 안에서 옆으로 밀어 본다 */
.c-now{container-type:inline-size}
@container (max-width:560px){
  .cur{flex-direction:column}.cur .cg{gap:6px}.mc{padding:8px 10px}.mc b{font-size:20px}
  .fc{overflow-x:auto;-webkit-overflow-scrolling:touch}.fl2{min-width:620px}
  .rain{grid-template-columns:64px repeat(3,1fr);gap:6px}.rain b{font-size:18px}
  .ch{flex-wrap:wrap}.ch span{text-align:left}
}
.nav a{padding:8px 12px;border-radius:9px;font-weight:700;color:var(--ink2);font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--card)}.nav a.on{background:var(--card);border:1px solid var(--line);color:var(--brand)}
.live{display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;color:var(--sev);background:var(--sevbg);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:2px;animation:liveBlink 2s ease-in-out infinite}
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.55}}
.ub{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding-left:10px;border-left:1px solid var(--line)}
.ib{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--ink2);padding:0}
.ib:hover{border-color:var(--border2)}.ib i{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--sev)}
.apw{position:relative}.ap{position:absolute;top:46px;right:0;z-index:70;width:min(370px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:0 18px 40px rgba(16,24,40,.22);padding:8px}
.ap h4{font-size:15.5px;padding:8px 10px 6px}.ap h4 small{font-size:13px;color:var(--ink3);font-weight:600;margin-left:6px}
.ap .sw{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}.ap .sw:hover{background:var(--soft)}
.ap .sw b{display:block;font-size:14.5px}.ap .sw span{display:block;font-size:13px;color:var(--ink3);margin-top:2px;line-height:1.45}
.ap .tg{flex:none;width:44px;height:24px;border-radius:12px;position:relative;background:var(--border2)}.ap .tg::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.ap .sw.on .tg{background:var(--brand)}.ap .sw.on .tg::after{left:23px}
.pageAlarm{position:fixed;inset:0;z-index:8990;pointer-events:none;animation:pagePulse 1.5s ease-in-out infinite}.pageAlarm[hidden]{display:none}
@keyframes pagePulse{0%,100%{box-shadow:inset 0 0 0 4px var(--severe)}50%{box-shadow:inset 0 0 0 10px var(--severe)}}
@media (prefers-reduced-motion: reduce){.pageAlarm{animation:none;box-shadow:inset 0 0 0 6px var(--severe)}}
.demo{position:relative}.demo>button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:800;font-size:14px;font-family:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
.demo>button.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
html.no-demo .demo>button:not(.on){display:none}   /* 'test' 명령으로 시연 단추 숨김(시연 중이면 끌 수 있게 그대로) */
/* '/' 명령 칸 */
.cmd{position:fixed;inset:0;z-index:9800;display:flex;align-items:center;justify-content:center;background:rgba(16,24,40,.35)}
.cmd>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(16,24,40,.3);display:flex;flex-direction:column;gap:10px;align-items:center}
.cmd input{width:min(360px,80vw);text-align:center;font-weight:700;font-size:20px;font-family:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--brand);background:var(--card);color:var(--ink);outline:none}
.cmd small{font-size:13px;font-weight:600;color:var(--ink3);text-align:center}
.cmdt{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:9900;background:rgba(15,27,45,.92);color:#fff;font-weight:700;font-size:15px;font-family:inherit;padding:12px 22px;border-radius:12px;pointer-events:none}
/* 시연 단계 단추 — 화면 아래 가운데 */
.dbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9400;display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:14px;background:var(--card);border:1px solid var(--border2);box-shadow:0 12px 32px rgba(16,24,40,.2)}
.dbar[hidden]{display:none}.dbar>span{font-size:14px;font-weight:800;color:var(--ink3);padding:0 4px;white-space:nowrap}
.dbar button{height:32px;min-width:54px;padding:0 12px;white-space:nowrap;border-radius:9px;border:1.5px solid;background:var(--card);font-weight:800;font-size:14.5px;font-family:inherit;color:var(--ink);cursor:pointer}
.dbar .x{border-color:var(--border2);background:#f3f7fc;color:var(--ink2)}
.demoTag{flex:none;background:#7c3aed;color:#fff;font-weight:900;font-size:14px;border-radius:8px;padding:6px 10px;white-space:nowrap}
/* 상태띠 */
.band{display:flex;align-items:center;gap:16px;border-radius:14px;padding:12px 18px;border:1px solid;background:var(--okbg);border-color:#cdeedd}
/* 상태띠 색 = 단계 색(준비 파랑 · 1단계 노랑 · 2단계 주황 · 3단계 빨강). 바탕·테두리는 그 색을 옅게 섞어 밝은·어두운 화면 모두 맞게 */
.band.l1{--bc:var(--blue)}.band.la{--bc:var(--amb)}.band.l2{--bc:var(--warn)}.band.l3{--bc:var(--sev)}
.band.l1,.band.la,.band.l2,.band.l3{background:color-mix(in srgb,var(--bc) 9%,var(--card));border-color:color-mix(in srgb,var(--bc) 35%,var(--card))}
.st{display:flex;align-items:center;gap:14px;flex:none;--c:var(--ok)}
.band.l1 .st,.band.la .st,.band.l2 .st,.band.l3 .st{--c:var(--bc)}
.st i{width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 16%,transparent);flex:none}
/* 준비 단계 이상 — 상태 원에서 고리가 퍼져 나가며 알린다(높을수록 빠르게). 움직임 줄이기 설정이면 멈춘다 */
@keyframes stPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent),0 0 0 9px color-mix(in srgb,var(--c) 16%,transparent)}
  100%{box-shadow:0 0 0 22px color-mix(in srgb,var(--c) 0%,transparent),0 0 0 9px color-mix(in srgb,var(--c) 16%,transparent)}}
.band.pu .st i{animation:stPulse 2.4s ease-out infinite}.band.pu.p2 .st i{animation-duration:1.8s}.band.pu.p3 .st i{animation-duration:1.3s}.band.pu.p4 .st i{animation-duration:1s}
@media (prefers-reduced-motion: reduce){.band .st i{animation:none!important}}
.st b{font-size:28px;font-weight:900;color:var(--ink);white-space:nowrap;letter-spacing:-.5px}
.bsum .l .wt{font-size:14px;padding:3px 9px}
.cnt{cursor:pointer}.band .cnt:hover{background:var(--soft)}
.bsum{flex:1;min-width:0}.bsum .l{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsum .l small{font-size:13px;color:var(--ink3);font-weight:600;margin-left:6px}
.bsum .s{font-size:13px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;flex:none}
.cnt .h{font-size:14.5px;font-weight:800;color:var(--ink3);padding:0 10px;border-right:1px solid var(--line);line-height:1.25;text-align:center}
.cnt .k{text-align:center;min-width:62px}.cnt .k b{display:block;font-size:22px;line-height:1.1}.cnt .k span{font-size:14px;color:var(--ink3);font-weight:700}
.wt{flex:none;font-size:14px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:1px}
/* 본문 */
.main{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 0}
.ch h3{font-size:15px;font-weight:800;white-space:nowrap}.ch span{font-size:14.5px;color:var(--ink3);text-align:right}
.map{padding:4px 10px 12px;display:flex;gap:10px;align-items:center}
.map svg{width:60%;height:auto;flex:none}
.map path{stroke:#fff;stroke-width:2.2;cursor:pointer;transition:filter .15s}.map path:hover{filter:brightness(.95)}
.map text{pointer-events:none;text-anchor:middle}.lbl,.lbl2{paint-order:stroke;stroke:var(--card);stroke-width:7px;stroke-linejoin:round}.lbl{font-weight:800;font-size:28px;fill:var(--lbl)}.lbl2{font-weight:700;font-size:22px;fill:var(--lbl2)}
.tbl{flex:1;font-size:13.5px;min-width:0}
.tbl .r{display:grid;grid-template-columns:74px 58px 56px 1fr;gap:6px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer}
.tbl .r:hover{background:#f5f7fb}.tbl .r.hd{color:var(--ink3);font-size:14px;font-weight:700;cursor:default}.tbl .r.hd:hover{background:none}
.tbl .r.me{background:var(--me);font-weight:800}
.tbl .wl{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}.tbl .wl .more{font-style:normal;font-size:13px;font-weight:800;color:var(--ink3)}
.tbl .tf{border:0;background:none;font-weight:700;font-size:13.5px;font-family:inherit;color:var(--brand);cursor:pointer;padding:0 0 0 6px}.tbl .tfl{display:block;padding:2px 6px 4px}.tbl.fold{width:auto!important;padding:6px 10px}.tbl .wl span{font-size:13.5px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px}
/* 지도 크게 — 기본 B: 지도 빈 자리에 관서 목록을 겹침 / A(주소 ?lay=a): 지도 아래 관서 칩 12개 */
.map.lay-a{flex-direction:column;align-items:stretch}.map.lay-a svg,.map.lay-b svg{width:100%;max-height:740px;display:block}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}.chip:hover{background:var(--soft)}
.chip.me{border-color:#9db7f5;background:#eef3ff}
.chip .n{font-size:13px;font-weight:800;color:var(--ink2)}.chip .v{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.chip .v b{font-size:19px}.chip .v span{font-size:14.5px;color:var(--ink3);font-weight:700}.chip .v span.wet{color:var(--blue)}
.chip .wl{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}.chip .wl span{font-size:13px;font-weight:800;color:#fff;border-radius:5px;padding:1px 5px}
.map.lay-b{position:relative;display:block}
.map.lay-b .tbl{position:absolute;right:14px;bottom:14px;width:350px;background:var(--over);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 20px rgba(16,24,40,.08);font-size:14.5px}
.map.lay-b .tbl .r{grid-template-columns:82px 62px 62px 1fr;padding:5px 8px}.map.lay-b .tbl .r.hd{font-size:14.5px}

    else if (tab==='info') {
      var bl = d.bulletins || {}, c2 = bl.commentary || {}, items = [];
      if (c2.title) items.push({ k:'해설', c:'', title:c2.title, sub:fmtTm(c2.tmFc)+' 발표 · '+no(c2.tmFc,c2.seq)+' · '+(c2.period||''), img:c2.img, text:c2.text, pdf:c2.pdf, url:wrnLink('cmt', c2.tmFc, c2.seq) });
      (bl.info_full||[]).slice(0,5).forEach(function(it){ var t = String(it.tmFc||''), ls = String(it.text||'').split('\n'), first = (ls[0]||'').trim(), head = /^<.*>$/.test(first);
        items.push({ k:'정보', c:'inf', title: head ? first.replace(/^<\s*|\s*>$/g,'') : (first.slice(0,40)||'기상정보'), sub: fmtTm(t)+' 발표 · '+no(t,it.seq),
          img: t.length>=12 ? 'https://www.weather.go.kr/w/repositary/image/wrn_img/fax_rpt_'+t.slice(0,12)+'_'+stn()+'_'+it.seq+'_1.png' : '', text:(head ? ls.slice(1).join('\n') : String(it.text||'')).trim(), url:wrnLink('inf', t, it.seq) }); });
      var mf = d.midForecast; if (mf && mf.content) items.push({ k:'중기', c:'mid', title:'중기 전망 (10일)', sub:(mf.tmFc_display||'')+' 발표', text:mf.content });
      var wi = d.weatherInfo; if (wi && wi.content) items.push({ k:'전국', c:'inf', title:'기상정보 · 전국', sub:(wi.tmFc_display||''), text:wi.content });
      p.innerHTML = items.length ? '<div class="wl2">'+items.map(function(x,i){ return '<div class="wi" data-i="'+i+'">'+(x.img?'<img src="'+esc(x.img)+'" alt="" onerror="this.style.display=\'none\'">':'')
        + '<div style="min-width:0"><div><span class="k '+x.c+'">'+x.k+'</span><b>'+esc(x.title)+'</b></div><p>'+esc(x.sub)+(x.pdf?' · PDF':'')+'</p></div></div>'; }).join('')+'</div>' : '<div class="empty">날씨 해설 자료 없음</div>';
      p.onclick = function(e){ var el = e.target.closest && e.target.closest('[data-i]'); if (!el) return; var x = items[+el.getAttribute('data-i')];
        modal(x.title, '<div class="meta">'+esc(x.sub)+'</div>'+(x.img?'<img src="'+esc(x.img)+'" alt="" onerror="this.remove()">':'')+'<div class="txt">'+esc(x.text||'')+'</div>'
          + '<div class="btns">'+(x.pdf?'<a class="btn pri" href="'+esc(x.pdf)+'" target="_blank" rel="noopener">📄 PDF 받기</a>':'')+(x.url?'<a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener">날씨누리 원문 ↗</a>':'')+'</div>'); };
    }

  }

  function render(){ if (!window.DASH) return; if (demo) demoD = makeDemo(demo); window.CB_DEMO_STAGE = demo==='severe' ? 4 : null; window.CB_DEMO_ON = !!demo;   /* 시연 중엔 새 판 자동 새로고침(version-check.js)을 미룬다 */   /* 시연 3단계 = 재대본 발령 가정(stage.js) */ renderTop(); renderBand(); renderMap(); renderFocus(); renderAlerts(); renderNow(); renderImg(); renderTabs(); renderDemo(); alarmTick(); }

  /* ── 공지·의견·알림 설정·화면 색 — 저장값 ggMuted·ggNoBlink·cbAlert*·ggTheme */
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function off(k){ return lsGet(k)==='1'; }
  function utils(){
    var nd = $('ntDot'); if (nd) nd.hidden = !(window.cbNotices && window.cbNotices.unseen() > 0);
    $('fbBtn').onclick = function(){ if (window.cbFeedback) window.cbFeedback.open({ page:'종합 현황' }); };
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    $('thBtn').textContent = dark ? '☀' : '☾';
    $('thBtn').onclick = function(){ var d2 = document.documentElement.getAttribute('data-theme')!=='dark'; document.documentElement.setAttribute('data-theme', d2?'dark':'light'); lsSet('ggTheme', d2?'dark':'light'); utils(); };
    $('alBtn').onclick = function(e){ e.stopPropagation(); var p = $('alPanel'); p.hidden = !p.hidden; if (!p.hidden) alertPanel(); };
    if (!utils._doc) { utils._doc = 1; document.addEventListener('click', function(e){ if (!e.target.closest || !e.target.closest('.apw')) $('alPanel').hidden = true; }); }
  }
  function alertPanel(){
    var perm = (typeof Notification!=='undefined') ? Notification.permission : 'unsupported';
    var rows = [
      { k:'ggMuted', label:'경보음', desc:'새 특보·재난문자가 들어오거나 3단계일 때 소리', on:!off('ggMuted') },
      { k:'ggNoBlink', label:'테두리 점멸', desc:'재대본 3단계·관서 경보·하천 경계일 때 화면 가장자리가 붉게 깜빡임', on:!off('ggNoBlink') },
      { k:'cbAlertCardsOff', label:'화면 알림 카드', desc:'새 특보·재난문자·해제가 있으면 오른쪽 위에 카드', on:!off('cbAlertCardsOff') },
      { k:'cbOsNotifyOff', label:'Windows 알림', desc: perm==='denied' ? '브라우저에서 막혀 있습니다 — 주소창 왼쪽 자물쇠에서 알림을 허용하세요' : perm==='unsupported' ? '이 브라우저는 지원하지 않습니다' : '창을 내려 둬도 화면 오른쪽 아래 Windows 알림', on: perm==='granted' && !off('cbOsNotifyOff'), os:1 },
      { k:'cbAlertDamOff', label:'댐 방류량 급증', desc:'괴산·충주·용담·대청댐 방류량이 수문 방류 수준을 넘어 3시간 사이 크게 늘면 카드·소리', on:!off('cbAlertDamOff') },
      { k:'cbNoticeToastOff', label:'새 공지 알림', desc:'공지사항에 새 글이 올라오면 오른쪽 아래 카드', on:!off('cbNoticeToastOff') }];
    var p = $('alPanel');
    p.innerHTML = '<h4>알림 설정<small>이 PC에 기억 · 종합 현황과 같이 적용</small></h4>' + rows.map(function(x,i){ return '<div class="sw'+(x.on?' on':'')+'" data-i="'+i+'" role="switch" aria-checked="'+x.on+'"><div style="flex:1;min-width:0"><b>'+x.label+'</b><span>'+x.desc+'</span></div><i class="tg"></i></div>'; }).join('');
    p.onclick = function(e){ e.stopPropagation(); var el = e.target.closest && e.target.closest('[data-i]'); if (!el) return; var x = rows[+el.getAttribute('data-i')];
      if (x.os && perm==='default') { lsSet('cbOsNotifyOff','0'); try{ Notification.requestPermission().then(alertPanel); }catch(e2){} return; }
      if (x.os && perm!=='granted') return;
      lsSet(x.k, off(x.k) ? '0' : '1'); if (x.k==='ggMuted') { if (!off('ggMuted')) audio(); } alertPanel(); alarmTick(); };
  }
  /* 위험할 때(재대본 3단계 · 관서 경보 · 관할 하천 경계) — 테두리 점멸 + 7초마다 경보음 */
  var actx = null, alarmT = null, alertKey = '';
  function audio(){ try{ if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
  function beep(fq, du, wh){ var ac = actx; if (!ac) return; var o = ac.createOscillator(), g = ac.createGain(); o.type='square'; o.frequency.value=fq; o.connect(g); g.connect(ac.destination);
    var t = ac.currentTime+(wh||0); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.28,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+du); o.start(t); o.stop(t+du+0.02); }
  function siren(){ if (off('ggMuted')) return; audio(); for (var i=0;i<3;i++) beep(880, 0.16, i*0.22); }
  function danger(){
    var d = D(), sg = window.cbStage ? window.cbStage(d.warnings, d.prelim, d.typhoon) : { rank:0 };
    if (sg.rank >= 4) return true;
    if (me !== WIDE && warnsOf(me).some(isBo)) return true;
    return riversOf(me).some(function(r){ return rLevel(r)==='danger'; });
  }
  function alarmTick(){
    var dg = danger();
    $('pageAlarm').hidden = !(dg && !off('ggNoBlink'));
    if (dg && !off('ggMuted')) { if (!alarmT) { siren(); alarmT = setInterval(function(){ if (danger() && !off('ggMuted')) siren(); }, 7000); } }
    else if (alarmT) { clearInterval(alarmT); alarmT = null; }
    /* 새 특보·예비특보·재난문자 화면 알림(alerts.js) — 자료가 바뀔 때만. 재난문자는 특보·재난문자 칸과 같은 범위. 시연이면 이 창 안에서만 비교 */
    var d = D(), key = (d.updated||'')+'|'+(demo||'')+'|'+me; if (key === alertKey || !window.cbAlerts) return; alertKey = key;
    var dams = (window.cbDamWatch ? window.cbDamWatch.list(d.rivers) : []).filter(function(x){ return x.state==='surge'; });
    try{ window.cbAlerts(d.warnings, d.prelim, msgsOf(me), { demo: !!demo, page:'new', dams: dams }); }catch(e){}
  }
  function renderDemo(){
    var bt = $('demoBtn'), bar = $('demoBar');
    bt.className = demo ? 'on' : ''; bt.textContent = demo ? '■ 시연 중' : '▶ 시연';
    bt.onclick = function(){ demo = demo ? null : 'ready'; demoD = null; render(); };   /* 시연은 준비 단계부터 */
    bar.hidden = !demo;
    if (demo) {
      bar.innerHTML = '<span>시연 단계</span>' + STAGES.map(function(x){ var on = x[0]===demo;
        return '<button data-s="'+x[0]+'" title="'+esc(x[2])+'" style="border-color:'+x[3]+';background:'+(on?x[3]:'#fff')+';color:'+(on?'#fff':'var(--ink)')+'">'+x[1]+'</button>'; }).join('')
        + '<button class="x" data-s="off">시연 종료</button>';
      bar.onclick = function(e){ var b = e.target.closest && e.target.closest('[data-s]'); if (!b) return; var k = b.getAttribute('data-s'); demo = k==='off' ? null : k; demoD = null; render(); };
      var bd = $('band'), nm = (STAGES.filter(function(x){ return x[0]===demo; })[0]||[])[1];
      if (!bd.querySelector('.demoTag')) bd.insertAdjacentHTML('afterbegin', '<span class="demoTag" title="실제 상황이 아닙니다">시연 · '+esc(nm)+'</span>');
    }
  }

  /* 1분마다 새 자료 — data.js 를 다시 받아 어댑터로 바꾼 뒤 다시 그린다 */
  function reload(){
    fetch('data.js?_t='+Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
      var i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i<0||j<0) return;
      var o = JSON.parse(t.slice(i, j+1)); if (!o || !o.updated) return;
      if (window.DASHBOARD_DATA && window.DASHBOARD_DATA.updated === o.updated) { renderTop(); return; }
      window.DASHBOARD_DATA = o; if (window.adaptDashboard) window.adaptDashboard(); render();
    }).catch(function(){});
  }
  utils();
  render(); setInterval(reload, 60000);
  window.addEventListener('cbstage', render);   /* 재대본 단계 직접 지정이 바뀌면(stage.js) */
})();
</script>
<script>
/* 입력 명령 — 119종합상황실과 같은 명령. '/' 를 누르면 가운데 명령 칸, 또는 입력 칸이 아닌 곳에서 단어를 바로 친다(4초 안).
   main 종합 현황 · wall 119종합상황실 · admin 관리자 화면 · test 시연 단추 숨기기/꺼내기 · stage 비상단계 지정(상황실 지정 창으로) · help 설명서.
   관리자 화면·단계 지정은 원래대로 관리자 키·지정 번호가 있어야 한다 */
(function(){
  var KEY = 'cbMapDemoHidden';
  function lsGet(){ try{ return localStorage.getItem(KEY)==='1'; }catch(e){ return false; } }
  function lsSet(v){ try{ localStorage.setItem(KEY, v?'1':'0'); }catch(e){} }
  document.documentElement.classList.toggle('no-demo', lsGet());
  function toast(t){ var d = document.createElement('div'); d.className = 'cmdt'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2200); }
  function go(t, url){ toast(t); setTimeout(function(){ location.href = url; }, 400); }
  var CMDS = {
    admin: function(){ go('관리자 화면으로 이동합니다', '관리자.html'); },
    test: function(){ var h = !lsGet(); lsSet(h); document.documentElement.classList.toggle('no-demo', h);
      toast(h ? '시연 단추를 숨겼습니다 — test 를 다시 치면 꺼냅니다' : '시연 단추를 꺼냈습니다(위쪽 ▶ 시연)'); },
    stage: function(){ go('비상단계 지정 창을 엽니다(119종합상황실)', '상황실.html?cmd=stage'); },
    help: function(){ go('설명서로 이동합니다', '도움말.html'); },
    main: function(){ toast('지금 종합 현황 화면입니다'); },
    wall: function(){ go('119종합상황실로 이동합니다', '상황실.html'); }
  };
  var box = null, typed = '', typedAt = 0;
  function close(){ if (box) { box.remove(); box = null; } }
  function open(){
    if (box) return;
    box = document.createElement('div'); box.className = 'cmd';
    box.innerHTML = '<div><input placeholder="명령 입력 후 Enter" autocomplete="off" spellcheck="false" aria-label="명령"><small>main 종합 현황 · wall 상황실 · admin 관리자 화면 · test 시연 단추 · stage 비상단계 지정 · help 설명서</small></div>';
    document.body.appendChild(box);
    var inp = box.querySelector('input');
    box.addEventListener('mousedown', function(e){ if (e.target === box) close(); });
    inp.addEventListener('keydown', function(e){
      e.stopPropagation();
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Enter') return;
      var k = inp.value.trim().toLowerCase().replace(/^\//, ''); close();
      if (CMDS[k]) CMDS[k](); else if (k) toast('알 수 없는 명령 — main · wall · admin · test · stage · help');
    });
    setTimeout(function(){ inp.focus(); }, 0);
  }
  document.addEventListener('keydown', function(e){
    var t = e.target, tag = (t && t.tagName) || '';
    if (e.ctrlKey || e.altKey || e.metaKey || tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (t && t.isContentEditable) || document.querySelector('.mbg')) return;
    if (e.key === '/') { e.preventDefault(); open(); return; }
    if (!/^[a-zA-Z]$/.test(e.key || '')) return;
    var now = Date.now(); if (now - typedAt > 4000) typed = ''; typedAt = now;
    typed = (typed + e.key.toLowerCase()).slice(-8);
    Object.keys(CMDS).some(function(k){ if (typed.slice(-k.length) === k) { typed = ''; CMDS[k](); return true; } });
  });
})();
</script>
