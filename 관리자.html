<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 페이지</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--ink:#1b2333;--ink2:#4a5568;--ink3:#7a8597;--line:#dde3ec;--brand:#2563eb;--soft:#eef3ff;
    --s-wait:#6b7280;--s-done:#0a8058;--s-hold:#b7791f;--s-no:#c0392b;--s-wait-bg:#f1f3f6;--s-done-bg:#e6f5ee;--s-hold-bg:#fdf3e1;--s-no-bg:#fbeaea}
  @media (prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#171e29;--ink:#eef2f8;--ink2:#b9c3d3;--ink3:#8592a6;--line:#2a3443;--brand:#5b8dff;--soft:#1c2740;
    --s-wait:#9aa4b5;--s-done:#3ccf8e;--s-hold:#f0b44c;--s-no:#ff7a6b;--s-wait-bg:#212a37;--s-done-bg:#14322a;--s-hold-bg:#362a14;--s-no-bg:#3a1d1d}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .back{color:var(--ink2);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font-weight:700;font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  input,select,button,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  button{cursor:pointer;font-weight:700}
  .n{color:var(--ink3);font-size:13px;margin-left:auto}
  /* 처리 상태별 건수 — 누르면 그 상태만 */
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .sum button{border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .sum button b{font-variant-numeric:tabular-nums}
  .sum button[aria-pressed=true]{border-color:var(--brand);background:var(--soft);color:var(--brand)}
  .item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--s-wait);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .item.st-done{border-left-color:var(--s-done)} .item.st-hold{border-left-color:var(--s-hold)} .item.st-no{border-left-color:var(--s-no)}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
  .tag{background:var(--soft);color:var(--brand);border-radius:6px;padding:1px 7px;font-weight:700}
  .k{border-radius:6px;padding:1px 8px;font-weight:800;color:#fff}
  .k-오류{background:#d64545}.k-기능{background:#2563eb}.k-새{background:#7c3aed}.k-기타{background:#6b7280}
  .who{color:var(--ink2);font-weight:700}
  .badge{margin-left:auto;border-radius:6px;padding:1px 9px;font-weight:800;font-size:12.5px}
  .b-wait{color:var(--s-wait);background:var(--s-wait-bg)} .b-done{color:var(--s-done);background:var(--s-done-bg)}
  .b-hold{color:var(--s-hold);background:var(--s-hold-bg)} .b-no{color:var(--s-no);background:var(--s-no-bg)}
  .txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  /* 처리 — 상태 4개 + 처리 내용 */
  .proc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:7px}
  .seg{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .seg .lb{font-size:12.5px;color:var(--ink3);font-weight:700;margin-right:3px}
  .seg button{padding:4px 11px;font-size:13px;border-radius:8px;color:var(--ink2)}
  .seg button[aria-pressed=true].v-wait{border-color:var(--s-wait);background:var(--s-wait-bg);color:var(--s-wait)}
  .seg button[aria-pressed=true].v-done{border-color:var(--s-done);background:var(--s-done-bg);color:var(--s-done)}
  .seg button[aria-pressed=true].v-hold{border-color:var(--s-hold);background:var(--s-hold-bg);color:var(--s-hold)}
  .seg button[aria-pressed=true].v-no{border-color:var(--s-no);background:var(--s-no-bg);color:var(--s-no)}
  .note{display:flex;gap:6px;align-items:flex-start}
  .note textarea{flex:1;min-height:38px;resize:vertical;font-size:13.5px;line-height:1.45}
  .note button.save{background:var(--brand);border-color:var(--brand);color:#fff;white-space:nowrap}
  .note button.save:disabled{opacity:.45;cursor:default}
  .saved{font-size:12px;color:var(--ink3)}
  .saved.err{color:var(--s-no)}
  .msg{padding:30px 10px;text-align:center;color:var(--ink3)}
  /* 관리자 탭(2026-11-12) — 받은 의견 · 공지사항 */
  .tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
  .tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;font-size:15px;color:var(--ink3)}
  .tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
  .tabs button .c{font-size:12px;margin-left:5px;color:var(--ink3);font-weight:700}
  /* 공지 */
  .nt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .nt.off{opacity:.55}
  .nt .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:5px}
  .nt h3{font-size:15.5px;margin:0 0 5px}
  .nt .b{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--ink2)}
  .nt .acts{margin-left:auto;display:flex;gap:6px}
  .nt .acts button{padding:3px 10px;font-size:12.5px}
  .nt .acts .del{color:var(--s-no)}
  .pill{border-radius:6px;padding:1px 8px;font-weight:800;color:#fff;font-size:12px}
  .p-새{background:#2563eb}.p-개선{background:#0a8058}.p-오류{background:#d97706}.p-안내{background:#6b7280}
  .src{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px}
  .ed{background:var(--card);border:2px solid var(--brand);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
  .ed .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ed label{font-size:12.5px;color:var(--ink3);font-weight:700}
  .ed textarea{min-height:130px;resize:vertical;line-height:1.5}
  .ed .go{background:var(--brand);border-color:var(--brand);color:#fff}
  .ed .err{color:var(--s-no);font-size:12.5px}
  /* hidden 속성이 display 지정(.gate 의 flex 등)에 지지 않게 */
  [hidden]{display:none!important}
  /* 관리자 키 입력(2026-11-12) — 주소(#k=)에 키를 싣지 않는다 */
  .gate{max-width:380px;margin:60px auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
  .gate h2{margin:0;font-size:17px}
  .gate p{margin:0;font-size:13px;color:var(--ink3);line-height:1.5}
  .gate input[type=password]{font-size:15px;padding:10px 12px}
  .gate .go{background:var(--brand);border-color:var(--brand);color:#fff;padding:10px}
  .gate .err{color:var(--s-no);font-size:13px;min-height:18px}
  .gate label{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center}
  .out{margin-left:auto;font-size:12.5px;color:var(--ink3);background:none;border:1px solid var(--line)}
</style>
</head><body>
<div class="wrap">
  <header>
    <a class="back" href="지도.html">← 종합 현황</a>
    <h1>관리자 페이지</h1>
    <button type="button" class="out" id="logout" hidden>키 지우기 · 나가기</button>
  </header>
  <form class="gate" id="gate" hidden autocomplete="off">
    <h2>🔒 관리자 키</h2>
    <p>관리자만 볼 수 있습니다.</p>
    <input type="password" id="gkey" placeholder="관리자 키" autocomplete="off" spellcheck="false">
    <label><input type="checkbox" id="gkeep"> 이 PC 에서 기억 (공용 PC 에서는 끄세요)</label>
    <button type="submit" class="go">들어가기</button>
    <div class="err" id="gerr"></div>
  </form>
  <div id="main" hidden>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tb-fb" aria-selected="true">받은 의견<span class="c" id="c-fb"></span></button>
    <button type="button" role="tab" id="tb-nt" aria-selected="false">공지사항<span class="c" id="c-nt"></span></button>
  </div>
  <section id="pane-fb">
  <div class="bar">
    <select id="kind"><option value="">모든 구분</option><option>오류</option><option>기능 제안</option><option>새 사이트 제안</option><option>기타</option></select>
    <select id="page"><option value="">모든 화면</option></select>
    <input id="q" type="search" placeholder="내용·부서·관서·처리 내용 검색" style="flex:1;min-width:180px">
    <button id="reload">새로고침</button>
    <button id="csv">CSV 받기</button>
    <span class="n" id="count"></span>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list"><div class="msg">불러오는 중…</div></div>
  </section>
  <!-- 공지사항 — 도움말.html '공지사항' 탭과 각 화면의 새 공지 알림에 나간다. 저장은 서버 .data/notices.json -->
  <section id="pane-nt" hidden>
    <div class="bar">
      <button type="button" id="ntNew" style="background:var(--brand);border-color:var(--brand);color:#fff">＋ 새 공지 쓰기</button>
      <button type="button" id="ntReload">새로고침</button>
      <a href="도움말.html#notice" target="_blank" rel="noopener" style="font-size:13px;color:var(--brand);font-weight:700;text-decoration:none">직원에게 보이는 화면 ↗</a>
      <span class="n" id="ntCount"></span>
    </div>
    <div id="ntEd"></div>
    <div id="ntList"><div class="msg">불러오는 중…</div></div>
  </section>
  </div>
</div>
<script src="notices.js"></script>
<script>
(function(){
  /* 처리 상태(2026-11-12) — 서버 tools/feedback.py 의 STATUSES 와 같은 이름. '대기'는 아직 손대지 않은 의견 */
  var ST=[['대기','wait'],['처리 완료','done'],['보류','hold'],['미수용','no']], CLS={}; ST.forEach(function(s){ CLS[s[0]]=s[1]; });
  var items=[], stFilter='', $=function(id){ return document.getElementById(id); };
  /* 관리자 키 — 화면에서 받아 이 탭(sessionStorage)에만, '이 PC 에서 기억'이면 localStorage 에 둔다. 주소에는 싣지 않는다.
     예전 비밀 주소(#k=키)로 열면 키를 옮겨 담고 주소에서 바로 지운다. 서버 PC(localhost)는 키 없이 열린다. */
  var KK='cbAdminKey';
  function store(){ try{ return sessionStorage.getItem(KK) || localStorage.getItem(KK) || ''; }catch(e){ return ''; } }
  function setKey(k, keep){ try{ sessionStorage.setItem(KK, k); if(keep) localStorage.setItem(KK, k); else localStorage.removeItem(KK); }catch(e){} }
  function clearKey(){ try{ sessionStorage.removeItem(KK); localStorage.removeItem(KK); }catch(e){} }
  (function(){ var m=/(?:^|[#&])k=([^&]+)/.exec(location.hash||'');
    if(m){ setKey(decodeURIComponent(m[1]), false); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } } })();
  function getKey(){ return store(); }
  function hdr(extra){ var h=extra||{}; var k=getKey(); if(k) h['X-Admin-Key']=k; return h; }
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

  function load(){
    $('list').innerHTML=''; $('list').appendChild(el('div','msg','불러오는 중…'));
    fetch('api/feedback',{cache:'no-store',headers:hdr()}).then(function(r){
      if(r.status===403) return {ok:false, code:403};
      return r.json().catch(function(){ return {ok:false, err: r.status===404||r.status===405||r.status===501 ? '이 서버에서는 의견 받기가 켜져 있지 않습니다' : '서버 응답 오류 ('+r.status+')'}; });
    }).then(function(j){
      if(j.code===403){ var had=!!getKey(); clearKey(); gate(had ? '키가 맞지 않습니다' : ''); return; }
      opened();
      if(!j.ok){ items=[]; render(j.err||'볼 수 없는 주소입니다'); return; }
      items=j.items||[];
      var pages={}; items.forEach(function(x){ if(x.page) pages[x.page]=1; });
      var sel=$('page'), cur=sel.value; sel.innerHTML='<option value="">모든 화면</option>';
      Object.keys(pages).sort().forEach(function(p){ var o=el('option',null,p); o.value=p; sel.appendChild(o); }); sel.value=cur;
      render();
    }).catch(function(){ render('서버에 연결하지 못했습니다'); });
  }
  function filtered(ignoreSt){
    var p=$('page').value, k=$('kind').value, q=$('q').value.trim().toLowerCase();
    return items.filter(function(x){ if(p && x.page!==p) return false; if(k && (x.kind||'기타')!==k) return false;
      if(!ignoreSt && stFilter && (x.status||'대기')!==stFilter) return false;
      if(q){ var s=[x.text,x.who,x.station,x.page,x.note].join(' ').toLowerCase(); if(s.indexOf(q)<0) return false; } return true; });
  }
  /* 상태별 건수 — 구분·화면·검색 조건은 따르고 상태 조건만 뺀 개수 */
  function renderSum(){
    var S=$('sum'); S.innerHTML=''; var base=filtered(true), cnt={};
    base.forEach(function(x){ var s=x.status||'대기'; cnt[s]=(cnt[s]||0)+1; });
    [['', '전체', base.length]].concat(ST.map(function(s){ return [s[0], s[0], cnt[s[0]]||0]; })).forEach(function(r){
      var b=el('button'); b.type='button'; b.setAttribute('aria-pressed', stFilter===r[0]?'true':'false');
      b.appendChild(el('span',null,r[1])); b.appendChild(el('b',null,String(r[2])));
      b.onclick=function(){ stFilter=r[0]; render(); }; S.appendChild(b); });
  }
  function render(err){
    var L=$('list'); L.innerHTML='';
    if(err){ L.appendChild(el('div','msg',err)); $('count').textContent=''; $('sum').innerHTML=''; return; }
    renderSum();
    $('c-fb').textContent=items.length||'';
    var f=filtered(); $('count').textContent='전체 '+items.length+'건'+(f.length!==items.length?' · 보이는 '+f.length+'건':'');
    if(!f.length){ L.appendChild(el('div','msg', items.length ? '조건에 맞는 의견이 없습니다' : '아직 받은 의견이 없습니다')); return; }
    f.forEach(function(x){ L.appendChild(card(x)); });
  }
  function card(x){
    var st=x.status||'대기', it=el('div','item st-'+CLS[st]), m=el('div','meta');
    var kd=x.kind||'기타'; m.appendChild(el('span','k k-'+kd.split(' ')[0],kd));
    m.appendChild(el('span',null,x.ts||''));
    if(x.page) m.appendChild(el('span','tag',x.page));
    if(x.station) m.appendChild(el('span',null,x.station));
    m.appendChild(el('span','who',x.who||'익명'));
    var badge=el('span','badge b-'+CLS[st],st); m.appendChild(badge);
    it.appendChild(m); it.appendChild(el('div','txt',x.text||''));

    /* 처리 — 상태를 고르고 처리 내용을 적어 저장 */
    var proc=el('div','proc'), seg=el('div','seg'), pick=st, btns=[];
    seg.appendChild(el('span','lb','처리'));
    ST.forEach(function(s){ var b=el('button','v-'+s[1],s[0]); b.type='button'; b.setAttribute('aria-pressed', s[0]===pick?'true':'false');
      b.onclick=function(){ pick=s[0]; btns.forEach(function(o){ o.setAttribute('aria-pressed', o.textContent===pick?'true':'false'); }); dirty(); };
      btns.push(b); seg.appendChild(b); });
    var row=el('div','note'), ta=el('textarea'); ta.maxLength=500; ta.rows=1; ta.value=x.note||'';
    ta.placeholder='어떻게 처리했는지 간단히 (예: 11/12 지도 글자 크기 조정 반영 · 공지사항 안내)';
    var save=el('button','save','저장'); save.type='button'; save.disabled=true;
    var info=el('div','saved', x.statusAt ? '마지막 저장 '+x.statusAt : '');
    function dirty(){ save.disabled = (pick===(x.status||'대기') && ta.value.trim()===(x.note||'')); }
    ta.oninput=dirty;
    ta.onkeydown=function(e){ if((e.ctrlKey||e.metaKey) && e.key==='Enter' && !save.disabled) save.click(); };
    save.onclick=function(){
      save.disabled=true; info.className='saved'; info.textContent='저장 중…';
      fetch('api/feedback',{method:'POST',cache:'no-store',headers:hdr({'Content-Type':'application/json','X-Requested-With':'cbweather'}),
        body:JSON.stringify({action:'status', id:x.id, status:pick, note:ta.value.trim()})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, err:'서버 응답 오류 ('+r.status+')'}; }); })
      .then(function(j){
        if(!j.ok){ info.className='saved err'; info.textContent=j.err||'저장하지 못했습니다'; dirty(); return; }
        x.status=j.status||pick; x.note=j.note||''; x.statusAt=j.at||'';
        it.className='item st-'+CLS[x.status]; badge.className='badge b-'+CLS[x.status]; badge.textContent=x.status;
        info.textContent='저장했습니다'+(x.statusAt?' · '+x.statusAt:''); dirty(); renderSum();
      }).catch(function(){ info.className='saved err'; info.textContent='서버에 연결하지 못했습니다'; dirty(); });
    };
    row.appendChild(ta); row.appendChild(save);
    proc.appendChild(seg); proc.appendChild(row); proc.appendChild(info);
    it.appendChild(proc);
    return it;
  }
  function csv(){
    var cell=function(v){ v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };   /* 엑셀 수식 실행 방지 */
    var rows=[['시각','구분','화면','관서','부서·이름','내용','처리 상태','처리 내용','처리 시각']].concat(filtered().map(function(x){
      return [x.ts,x.kind||'기타',x.page,x.station,x.who||'익명',x.text,x.status||'대기',x.note||'',x.statusAt||'']; }));
    var b=new Blob(['﻿'+rows.map(function(r){ return r.map(cell).join(','); }).join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='의견_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  $('page').onchange=function(){ render(); }; $('kind').onchange=function(){ render(); }; $('q').oninput=function(){ render(); };
  $('reload').onclick=load; $('csv').onclick=csv;
  /* 키 입력 화면 */
  function gate(msg){ $('main').hidden=true; $('gate').hidden=false; $('logout').hidden=true; $('gerr').textContent=msg||''; $('gkey').value=''; $('gkey').focus(); }
  function opened(){ $('gate').hidden=true; $('main').hidden=false; $('logout').hidden=!store(); }
  $('gate').onsubmit=function(e){ e.preventDefault(); var k=$('gkey').value.trim(); if(!k){ $('gerr').textContent='키를 넣으세요'; return; }
    setKey(k, $('gkeep').checked); $('gerr').textContent='확인 중…'; load(); };
  $('logout').onclick=function(){ clearKey(); gate('키를 지웠습니다'); };
  load();

  /* ── 탭 ── */
  function tab(t){
    var nt = t==='nt';
    $('pane-fb').hidden=nt; $('pane-nt').hidden=!nt;
    $('tb-fb').setAttribute('aria-selected', nt?'false':'true'); $('tb-nt').setAttribute('aria-selected', nt?'true':'false');
    try{ sessionStorage.setItem('cbAdminTab', t); }catch(e){}
  }
  $('tb-fb').onclick=function(){ tab('fb'); }; $('tb-nt').onclick=function(){ tab('nt'); };
  try{ if(sessionStorage.getItem('cbAdminTab')==='nt') tab('nt'); }catch(e){}

  /* ── 공지사항 ── notices.js 의 기본 공지 + 서버에서 고친 것(over). 고치기·지우기·새로 쓰기는 서버에 id 로 저장 */
  var NK=['새 기능','개선','오류 수정','안내'], over=[], N=window.cbNotices||{base:[], merge:function(){ return []; }};
  function pad(n){ return (n<10?'0':'')+n; }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function newId(date){   /* 날짜-시분(예 2026-11-12-1430) — 같은 분에 또 쓰면 뒤에 a·b… */
    var d=new Date(), id=date+'-'+pad(d.getHours())+pad(d.getMinutes()), all={}, k=0;
    (N.base||[]).concat(over).forEach(function(n){ all[n.id]=1; });
    var base=id; while(all[id]){ id=base+'abcdefghijklmnopqrstuvwxyz'.charAt(k++); }
    return id;
  }
  function ntLoad(){
    $('ntList').innerHTML=''; $('ntList').appendChild(el('div','msg','불러오는 중…'));
    fetch('api/feedback?notices=1',{cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){ over=(j && j.ok && j.items) || []; ntRender(); })
      .catch(function(){ over=[]; ntRender('서버에 연결하지 못했습니다 — 기본 공지만 보입니다'); });
  }
  function ntRender(warn){
    var L=$('ntList'); L.innerHTML='';
    if(warn) L.appendChild(el('div','msg',warn));
    var list=N.merge(over), byOver={}; over.forEach(function(o){ byOver[o.id]=o; });
    $('c-nt').textContent=list.length; $('ntCount').textContent='보이는 공지 '+list.length+'건';
    if(!list.length) L.appendChild(el('div','msg','공지가 없습니다. ＋ 새 공지 쓰기로 올리세요.'));
    list.forEach(function(n){
      var c=el('div','nt'), h=el('div','h');
      h.appendChild(el('span','pill p-'+String(n.kind||'안내').split(' ')[0], n.kind||'안내'));
      h.appendChild(el('span',null,n.date||''));
      if(n.from) h.appendChild(el('span',null,'· '+n.from));
      var isBase=(N.base||[]).some(function(b){ return b.id===n.id; });
      h.appendChild(el('span','src', byOver[n.id] ? (isBase?'기본 공지 · 여기서 고침':'여기서 씀')+(n.at?' '+n.at:'') : '기본 공지(코드)'));
      var acts=el('span','acts'), e=el('button',null,'고치기'), d=el('button','del','지우기');
      e.type=d.type='button'; e.onclick=function(){ ntEdit(n); }; d.onclick=function(){ ntDel(n); };
      acts.appendChild(e); acts.appendChild(d); h.appendChild(acts);
      c.appendChild(h); c.appendChild(el('h3',null,n.title||'')); c.appendChild(el('div','b',n.body||''));
      L.appendChild(c);
    });
  }
  function post(body){
    return fetch('api/feedback',{method:'POST',cache:'no-store',headers:hdr({'Content-Type':'application/json','X-Requested-With':'cbweather'}),body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, err:'서버 응답 오류 ('+r.status+')'}; }); })
      .catch(function(){ return {ok:false, err:'서버에 연결하지 못했습니다'}; });
  }
  function ntEdit(n){
    var isNew=!n; n=n||{date:today(), kind:'안내', title:'', body:'', from:''};
    var E=$('ntEd'); E.innerHTML=''; var f=el('div','ed');
    f.appendChild(el('b',null, isNew?'새 공지':'공지 고치기'));
    var r1=el('div','r'), kd=el('select'), dt=el('input'), fr=el('input');
    NK.forEach(function(k){ var o=el('option',null,k); o.value=k; kd.appendChild(o); }); kd.value=n.kind||'안내';
    dt.type='date'; dt.value=n.date||today(); fr.placeholder='출처(선택) 예: 의견 반영'; fr.maxLength=40; fr.value=n.from||'';
    r1.appendChild(el('label',null,'구분')); r1.appendChild(kd); r1.appendChild(el('label',null,'날짜')); r1.appendChild(dt); r1.appendChild(fr);
    var ti=el('input'); ti.placeholder='제목 (예: 🔥 산불 위험도에 전국 지도가 붙었습니다)'; ti.maxLength=100; ti.value=n.title||'';
    var bd=el('textarea'); bd.placeholder='내용 — 줄바꿈 그대로 보입니다'; bd.maxLength=3000; bd.value=n.body||'';
    var r2=el('div','r'), ok=el('button','go', isNew?'올리기':'저장'), no=el('button',null,'취소'), er=el('span','err');
    ok.type=no.type='button';
    no.onclick=function(){ E.innerHTML=''; };
    ok.onclick=function(){
      if(ti.value.trim().length<2){ er.textContent='제목을 적어 주세요'; return; }
      ok.disabled=true; er.textContent='저장 중…';
      var item={id: isNew ? newId(dt.value||today()) : n.id, date:dt.value||today(), kind:kd.value, title:ti.value.trim(), body:bd.value.trim(), from:fr.value.trim()};
      post({action:'notice_save', item:item}).then(function(j){
        ok.disabled=false;
        if(!j.ok){ er.textContent=j.err||'저장하지 못했습니다'; return; }
        E.innerHTML=''; ntLoad();
      });
    };
    r2.appendChild(ok); r2.appendChild(no); r2.appendChild(er);
    f.appendChild(r1); f.appendChild(ti); f.appendChild(bd); f.appendChild(r2);
    E.appendChild(f); ti.focus(); window.scrollTo(0, E.offsetTop-10);
  }
  function ntDel(n){
    if(!confirm('이 공지를 지울까요?\n\n「'+(n.title||'')+'」\n\n모든 화면의 공지사항에서 사라집니다.')) return;
    post({action:'notice_delete', id:n.id}).then(function(j){ if(!j.ok){ alert(j.err||'지우지 못했습니다'); return; } ntLoad(); });
  }
  $('ntNew').onclick=function(){ ntEdit(null); }; $('ntReload').onclick=ntLoad;
  ntLoad();
})();
</script>
</body></html>
