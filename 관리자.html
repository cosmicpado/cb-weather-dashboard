<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 페이지</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--ink:#1b2333;--ink2:#4a5568;--ink3:#5f6d85;--line:#dde3ec;--brand:#2563eb;--soft:#eef3ff;
    --s-wait:#6b7280;--s-done:#0a8058;--s-hold:#b7791f;--s-no:#c0392b;--s-wait-bg:#f1f3f6;--s-done-bg:#e6f5ee;--s-hold-bg:#fdf3e1;--s-no-bg:#fbeaea}
  /* 관리자 페이지는 늘 밝은 화면(2026-11-12 사용자 결정) — 컴퓨터가 어두운 모드여도 */
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font:14px/1.55 Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .back{color:var(--ink2);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font-weight:700;font-size:13px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  input,select,button,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  button{cursor:pointer;font-weight:700}
  .n{color:var(--ink3);font-size:13px;margin-left:auto}
  /* 처리 상태별 건수 — 누르면 그 상태만 */
  .sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .sum button{border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .sum button b{font-variant-numeric:tabular-nums}
  .sum button[aria-pressed=true]{border-color:var(--brand);background:var(--soft);color:var(--brand)}
  .item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--s-wait);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .item.st-done{border-left-color:var(--s-done)} .item.st-hold{border-left-color:var(--s-hold)} .item.st-no{border-left-color:var(--s-no)}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink3);margin-bottom:6px}
  .tag{background:var(--soft);color:var(--brand);border-radius:6px;padding:1px 7px;font-weight:700}
  .k{border-radius:6px;padding:1px 8px;font-weight:800;color:#fff}
  .k-오류{background:#d64545}.k-기능{background:#2563eb}.k-새{background:#7c3aed}.k-기타{background:#6b7280}
  .who{color:var(--ink2);font-weight:700}
  .badge{margin-left:auto;border-radius:6px;padding:1px 9px;font-weight:800;font-size:13px}
  .b-wait{color:var(--s-wait);background:var(--s-wait-bg)} .b-done{color:var(--s-done);background:var(--s-done-bg)}
  .b-hold{color:var(--s-hold);background:var(--s-hold-bg)} .b-no{color:var(--s-no);background:var(--s-no-bg)}
  .txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  /* 처리 — 상태 4개 + 처리 내용 */
  .proc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:7px}
  .seg{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .seg .lb{font-size:13px;color:var(--ink3);font-weight:700;margin-right:3px}
  .seg button{padding:4px 11px;font-size:13px;border-radius:8px;color:var(--ink2)}
  .seg button[aria-pressed=true].v-wait{border-color:var(--s-wait);background:var(--s-wait-bg);color:var(--s-wait)}
  .seg button[aria-pressed=true].v-done{border-color:var(--s-done);background:var(--s-done-bg);color:var(--s-done)}
  .seg button[aria-pressed=true].v-hold{border-color:var(--s-hold);background:var(--s-hold-bg);color:var(--s-hold)}
  .seg button[aria-pressed=true].v-no{border-color:var(--s-no);background:var(--s-no-bg);color:var(--s-no)}
  .note{display:flex;gap:6px;align-items:flex-start}
  .note textarea{flex:1;min-height:38px;resize:vertical;font-size:13.5px;line-height:1.45}
  .note button.save{background:var(--brand);border-color:var(--brand);color:#fff;white-space:nowrap}
  .note button.save:disabled{opacity:.45;cursor:default}
  .saved{font-size:13px;color:var(--ink3)}
  .saved.err{color:var(--s-no)}
  /* 의견 지우기(2026-11-16) — 원본 파일에서도 지운다 */
  .seg button.del{margin-left:auto;color:var(--ink3)}
  .seg button.del:hover{color:var(--s-no);border-color:var(--s-no)}
  .msg{padding:30px 10px;text-align:center;color:var(--ink3)}
  /* 관리자 탭(2026-11-12) — 받은 의견 · 공지사항 */
  .tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
  .tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;font-size:15px;color:var(--ink3)}
  .tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
  .tabs button .c{font-size:13px;margin-left:5px;color:var(--ink3);font-weight:700}
  /* 공지 */
  .nt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .nt.off{opacity:.55}
  .nt .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink3);margin-bottom:5px}
  .nt h3{font-size:15.5px;margin:0 0 5px}
  .nt .b{white-space:pre-wrap;word-break:break-word;font-size:14px;color:var(--ink2)}
  .nt .acts{margin-left:auto;display:flex;gap:6px}
  .nt .acts button{padding:3px 10px;font-size:13px}
  .nt .acts .del{color:var(--s-no)}
  /* 접속 통계 — 카드 · 날짜별 막대(숫자 표시, 예전 방식 날은 흐리게) · 화면별 | 브라우저별 · 시간대별 */
  .ac-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ac-c{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--card);display:flex;flex-direction:column;gap:3px}
  .ac-c>span{font-size:13px;color:var(--ink3);font-weight:700}.ac-c b{font-size:30px;line-height:1.15}.ac-c b small{font-size:15px;margin-left:2px}
  .ac-c em{font-style:normal;font-size:13px;color:var(--ink2)}.ac-c em.d{color:var(--ink3)}
  .ac-box{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px;margin-top:12px;min-width:0}
  .ac-box h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ac-box h3 small{font-size:13px;font-weight:600;color:var(--ink3)}
  .ac-two{display:grid;grid-template-columns:3fr 2fr;gap:12px}.ac-two>.ac-box{margin-top:12px}
  @media (max-width:900px){.ac-two{grid-template-columns:1fr}.ac-cards{grid-template-columns:1fr}}
  .ac-t{width:100%;border-collapse:collapse;font-size:14px}.ac-t th,.ac-t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
  .ac-t th{font-size:13px;color:var(--ink3);font-weight:700}.ac-t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.ac-t th.n{text-align:right}
  .ac-t small{color:var(--ink3);font-size:13px;display:block}
  .ac-bars{display:flex;gap:3px;border-bottom:1px solid var(--line)}
  .ac-bars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
  .ac-bars .col{height:118px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
  .ac-bars em{font-style:normal;font-size:13px;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums;line-height:16px}
  .ac-bars i{display:block;background:var(--brand);border-radius:3px 3px 0 0}
  .ac-bars i.m{background:#f59e0b;margin-bottom:2px}   /* 휴대폰(위)·PC(아래) 사이 2px 틈 */
  #acBody.mob .ac-bars i{background:#f59e0b}            /* 휴대폰만 볼 땐 막대도 휴대폰 색 */
  .ac-bars .old i{opacity:.4}                          /* 11-23 이전(예전 방식 — 실제보다 많음) */
  .ac-bars>div>span{font-size:13px;color:var(--ink3);margin-top:3px;line-height:16px}
  .ac-bars .today>span{color:var(--ink);font-weight:800}
  .ac-tw{overflow-x:auto}.ac-t td:first-child{white-space:nowrap}
  @media (max-width:700px){.ac-bars em{display:none}.ac-bars>div>span:not(.k){visibility:hidden}}   /* 좁으면 눈금 글자를 띄엄띄엄 */
  .ac-lg{display:inline-flex;gap:12px;font-size:13px;font-weight:600;color:var(--ink2)}.ac-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .ac-br{display:grid;grid-template-columns:auto 1fr auto;gap:7px 10px;align-items:center;font-size:14px}
  .ac-br .tr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.ac-br .tr i{display:block;height:100%;background:var(--brand);border-radius:5px}
  .ac-br .v{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .ac-seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#eceff4;border:1px solid var(--line)}
  .ac-seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer}
  .ac-seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.14)}
  .ac-note{font-size:13px;color:var(--ink3);line-height:1.6}
  details.ac-how{margin-top:12px;font-size:13px;color:var(--ink2);line-height:1.7}details.ac-how summary{cursor:pointer;font-weight:700;color:var(--ink2)}
  details.ac-how ul{margin:6px 0 0;padding-left:18px}
  /* 비상단계 기준 — 왼쪽 대상 · 가운데 단계별 조건 묶음 · 오른쪽 미리 보기 */
  .wrap:has(#pane-sr:not([hidden])){max-width:1320px}   /* 이 탭은 세 칸이라 넓게 — 조건 줄이 꺾이지 않게 */
  .sr-grid{display:grid;grid-template-columns:220px minmax(560px,1fr) 300px;gap:14px;align-items:start}
  @media (max-width:1050px){.sr-grid{grid-template-columns:1fr}}
  .sr-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .sr-box h3{font-size:15px;margin:0 0 10px}
  .sr-note{font-size:13px;color:var(--ink3);line-height:1.55;margin:8px 0 0}
  .sr-tg{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 10px;margin-bottom:3px;cursor:pointer;font:inherit;font-size:14px;font-weight:700;color:var(--ink2)}
  .sr-tg em{margin-left:auto;font-style:normal;font-size:13px;font-weight:600;color:var(--ink3)}
  .sr-tg:hover{background:#f2f5fa}.sr-tg.on{background:var(--soft);color:var(--brand)}
  .sr-tg.own em{color:#0f766e;font-weight:800}
  .sr-box h3 small{font-size:13px;font-weight:600;color:var(--ink3);margin-left:8px}
  .sr-seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:#eceff4;border:1px solid var(--line);margin-bottom:10px}
  .sr-seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer}
  .sr-seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.14)}
  .sr-sc{font-size:13.5px;color:var(--ink2);background:#f6f8fb;border-radius:9px;padding:8px 10px;line-height:1.55;margin-bottom:10px}
  .sr-sc .sr-note{margin-top:2px}
  .sr-ot{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}.sr-ot td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .sr-ot td:last-child{text-align:right;font-weight:800}.sr-ot i{font-style:normal;color:#0f766e;font-weight:700;font-size:13px}
  .sr-mode{display:flex;gap:8px;margin-bottom:10px}
  .sr-mode label{flex:1;display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);cursor:pointer;font-size:14px}
  .sr-mode label.on{border-color:var(--brand);background:var(--soft)}
  .sr-mode label b{display:block;font-size:14.5px}.sr-mode label span span{font-size:13px;color:var(--ink3)}
  .sr-mode input{margin-top:3px}
  .sr-stg{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
  .sr-stg>.h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:800;font-size:15px;background:color-mix(in srgb,var(--c) 8%,#fff)}
  .sr-stg .pill{font-size:13px;font-weight:800;color:#fff;border-radius:7px;padding:2px 9px;background:var(--c)}
  .sr-stg .bd{padding:10px 14px 12px}
  .sr-grp{border:1px dashed #c3cddb;border-radius:10px;padding:8px 10px;background:#fafbfd}
  .sr-cond{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;padding:3px 0}
  .sr-sel{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font:inherit;font-size:14px;font-weight:700;color:var(--ink)}
  .sr-num{width:56px;height:32px;border:1px solid var(--line);border-radius:8px;text-align:center;font:inherit;font-size:14px;font-weight:800}
  .sr-num.s{width:48px;height:30px}
  .sr-ro{font-size:14px;font-weight:700;color:var(--ink2)}
  .sr-x{margin-left:auto;border:0;background:transparent;color:var(--ink3);font-size:15px;cursor:pointer;padding:2px 6px;border-radius:6px}.sr-x:hover{background:#fdecec;color:#b42318}
  .sr-and{display:inline-block;font-size:13px;font-weight:800;color:#6d28d9;background:#f3eefe;border-radius:6px;padding:1px 8px;margin:3px 0}
  .sr-or{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;font-weight:800;color:var(--ink3)}
  .sr-or:before,.sr-or:after{content:'';flex:1;border-top:1px solid var(--line)}
  .sr-add{border:0;background:transparent;color:var(--brand);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px;display:block}
  .sr-add.g{margin-top:8px}
  .sr-empty{font-size:13.5px;color:var(--ink3);padding:2px 0 4px}
  .sr-duty{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sr-duty .k{flex:none;width:150px;font-size:13.5px;font-weight:800;color:var(--ink2)}
  .sr-duty input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:14.5px;font-weight:700}
  .sr-sub{font-size:13px;font-weight:800;color:var(--ink3);margin:6px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
  .sr-res strong{display:block;margin-top:3px;color:var(--ink);font-weight:800}
  .sr-ot td small{display:block;font-size:13px;font-weight:700;color:var(--ink2)}
  .sr-pin{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .sr-vt{border-collapse:collapse;font-size:13px;width:100%;margin:0 0 4px}.sr-vt th{font-weight:700;color:var(--ink3);padding:3px 2px;text-align:center}
  .sr-vt td{padding:3px 2px;text-align:center}.sr-vt td:first-child{text-align:left;font-weight:700;color:var(--ink2);font-size:14px}
  .sr-chk{font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;margin:2px 0 8px}
  .sr-btn{height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 14px;font:inherit;font-weight:800;font-size:14px;color:var(--ink2);cursor:pointer}
  .sr-btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
  .sr-res{display:flex;align-items:center;gap:12px;border-radius:11px;padding:10px 12px;background:color-mix(in srgb,var(--c) 11%,#fff);font-size:13.5px;color:var(--ink2);line-height:1.45}
  .sr-res b{font-size:24px;font-weight:900;white-space:nowrap;color:var(--c)}
  .sr-res.zero{background:#f3f5f9}.sr-res.zero b{color:var(--ink3)}
  .sr-save{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 14px -12px rgba(16,24,40,.4)}
  .sr-save .t{flex:1;min-width:220px}.sr-save .t b{font-size:14.5px}.sr-save .sr-msg{margin-top:2px}
  .sr-tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .sr-tbl summary{cursor:pointer;font-size:14px;font-weight:800;color:var(--ink2)}
  .sr-tbl table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  .sr-tbl th,.sr-tbl td{border:1px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;line-height:1.45}
  .sr-tbl th{background:#f3f5f9;font-weight:800}.sr-tbl td:first-child{font-weight:800;background:#f8fafc}
  .sr-tbl th.y{background:#fff3c4}.sr-tbl th.o{background:#ffd8b5}.sr-tbl th.r{background:#ffd0d0}
  .sr-tbl p{font-size:13px;color:var(--ink3);margin:8px 0 0;line-height:1.55}
  .sr-msg{font-size:13px;color:#b45309;margin-top:8px}.sr-msg.ok{color:var(--ink3)}.sr-msg.err{color:var(--s-no)}
  .pill{border-radius:6px;padding:1px 8px;font-weight:800;color:#fff;font-size:13px}
  .p-새{background:#2563eb}.p-개선{background:#0a8058}.p-오류{background:#d97706}.p-안내{background:#6b7280}
  .src{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
  .ed{background:var(--card);border:2px solid var(--brand);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
  .ed .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ed label{font-size:13px;color:var(--ink3);font-weight:700}
  .ed textarea{min-height:130px;resize:vertical;line-height:1.5}
  .ed .go{background:var(--brand);border-color:var(--brand);color:#fff}
  .ed .err{color:var(--s-no);font-size:13px}
  .dt-note{font-size:13px;color:var(--ink2);line-height:1.6;margin:12px 2px 0}
  .dt-note table{border-collapse:collapse;margin-top:6px;font-size:13px}
  .dt-note td,.dt-note th{border:1px solid var(--line);padding:4px 8px;text-align:left}
  .dt-msg{font-size:13px;color:var(--ink3)} .dt-msg.err{color:var(--s-no)} .dt-msg.ok{color:var(--s-done)}
  /* hidden 속성이 display 지정(.gate 의 flex 등)에 지지 않게 */
  [hidden]{display:none!important}
  /* 관리자 키 입력(2026-11-12) — 주소(#k=)에 키를 싣지 않는다 */
  .gate{max-width:380px;margin:60px auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
  .gate h2{margin:0;font-size:17px}
  .gate p{margin:0;font-size:13px;color:var(--ink3);line-height:1.5}
  .gate input[type=password]{font-size:15px;padding:10px 12px}
  .gate .go{background:var(--brand);border-color:var(--brand);color:#fff;padding:10px}
  .gate .err{color:var(--s-no);font-size:13px;min-height:18px}
  .gate label{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center}
  .out{margin-left:auto;font-size:13px;color:var(--ink3);background:none;border:1px solid var(--line)}
</style>
</head><body>
<div class="wrap">
  <header>
    <a class="back" href="종합.html">← 종합 현황</a>
    <h1>관리자 페이지</h1>
    <button type="button" class="out" id="logout" hidden>키 지우기 · 나가기</button>
  </header>
  <form class="gate" id="gate" hidden autocomplete="off">
    <h2>🔒 관리자 키</h2>
    <p>관리자만 볼 수 있습니다.</p>
    <input type="password" id="gkey" placeholder="관리자 키" autocomplete="off" spellcheck="false">
    <label><input type="checkbox" id="gkeep"> 이 PC 에서 기억 (공용 PC 에서는 끄세요)</label>
    <button type="submit" class="go">들어가기</button>
    <div class="err" id="gerr"></div>
  </form>
  <div id="main" hidden>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tb-fb" aria-selected="true">받은 의견<span class="c" id="c-fb"></span></button>
    <button type="button" role="tab" id="tb-nt" aria-selected="false">공지사항<span class="c" id="c-nt"></span></button>
    <button type="button" role="tab" id="tb-sr" aria-selected="false">비상단계 · 근무</button>
    <button type="button" role="tab" id="tb-ac" aria-selected="false">접속 통계</button>
  </div>
  <section id="pane-fb">
  <div class="bar">
    <select id="kind"><option value="">모든 구분</option><option>오류</option><option>기능 제안</option><option>새 사이트 제안</option><option>기타</option></select>
    <input id="q" type="search" placeholder="내용·부서·이름·처리 내용 검색" style="flex:1;min-width:180px">
    <button id="reload">새로고침</button>
    <button id="csv">CSV 받기</button>
    <span class="n" id="count"></span>
  </div>
  <div class="sum" id="sum"></div>
  <div id="list"><div class="msg">불러오는 중…</div></div>
  </section>
  <!-- 공지사항 — 도움말.html '공지사항' 탭과 각 화면의 새 공지 알림에 나간다. 저장은 서버 .data/notices.json -->
  <section id="pane-nt" hidden>
    <div class="bar">
      <button type="button" id="ntNew" style="background:var(--brand);border-color:var(--brand);color:#fff">＋ 새 공지 쓰기</button>
      <button type="button" id="ntReload">새로고침</button>
      <a href="도움말.html#notice" target="_blank" rel="noopener" style="font-size:13px;color:var(--brand);font-weight:700;text-decoration:none">직원에게 보이는 화면 ↗</a>
      <span class="n" id="ntCount"></span>
    </div>
    <div id="ntEd"></div>
    <div id="ntList"><div class="msg">불러오는 중…</div></div>
  </section>
  <!-- 비상근무(2026-11-16) — 상황실 오른쪽 위 '비상근무' 칸에 나가는 기준표. 저장은 서버 .data/duty.json, 기본값은 duty.js -->
  <!-- 접속 통계(2026-11-18) — 서버 .data/access/ 기록(tools/access_log.py). 화면이 3초 넘게 보이면 1회(access-hit.js). IP 는 저장하지 않는다 -->
  <section id="pane-ac" hidden>
    <div class="bar"><button type="button" id="acReload">새로고침</button>
      <span class="ac-seg" id="acDev" role="group" aria-label="기기"><button type="button" data-d="all" aria-pressed="true">전체</button><button type="button" data-d="PC" aria-pressed="false">PC</button><button type="button" data-d="휴대폰" aria-pressed="false">휴대폰</button></span>
      <span class="n" id="acAt"></span></div>
    <div id="acBody"><div class="msg">불러오는 중…</div></div>
  </section>
  <!-- 비상단계 · 근무(2026-11-23) — 소방본부·119종합상황실의 단계별 근무(.data/duty.json)와 단계를 정하는 조건(.data/stage_rules.json). 계산은 stage.js -->
  <section id="pane-sr" hidden>
    <div id="srBody" class="sr-grid"><div class="msg">불러오는 중…</div></div>
    <!-- 재대본 비상단계 지정 번호(2026-11-16) — 상황실 비상단계 칸을 눌러 단계를 직접 지정할 때 묻는 번호 -->
    <div class="dt-note sr-pin">
      <b>비상단계 지정 번호</b> — 상황실 화면에서 재대본 발령 단계를 직접 지정할 때 묻는 번호입니다.
      여기서 정하면 <b>모든 상황실 화면에서 이 번호로</b> 단계를 지정할 수 있습니다.<br>
      · 정한 번호는 다시 볼 수 없습니다. 잊으면 새 번호로 다시 정하세요.
      <div class="bar" style="margin-top:8px">
        <input id="pinIn" type="password" inputmode="numeric" maxlength="7" placeholder="숫자 7자리" autocomplete="new-password" style="width:160px">
        <button type="button" id="pinSave">번호 저장</button>
        <button type="button" id="pinDel">번호 지우기</button>
        <span class="dt-msg" id="pinMsg"></span>
      </div>
    </div>
  </section>
  </div>
</div>
<script src="clock-sync.js"></script>
<script src="error-report.js"></script>   <!-- 화면 오류를 서버에 남긴다(관리자 화면 접속 통계 탭) -->
<script src="short-url.js"></script>
<script src="notices.js"></script>
<script>window.CB_DUTY_NOAUTO = true;</script>
<script src="duty.js"></script>
<script src="region.js"></script>
<script src="stage.js"></script>   <!-- 비상단계 · 근무 탭 — 미리 보기가 화면과 같은 계산을 쓴다 -->
<script>
(function(){
  /* 처리 상태(2026-11-12) — 서버 tools/feedback.py 의 STATUSES 와 같은 이름. '대기'는 아직 손대지 않은 의견 */
  var ST=[['대기','wait'],['처리 완료','done'],['보류','hold'],['미수용','no']], CLS={}; ST.forEach(function(s){ CLS[s[0]]=s[1]; });
  var items=[], stFilter='', $=function(id){ return document.getElementById(id); };
  /* 관리자 키 — 화면에서 받아 이 탭(sessionStorage)에만, '이 PC 에서 기억'이면 localStorage 에 둔다. 주소에는 싣지 않는다.
     예전 비밀 주소(#k=키)로 열면 키를 옮겨 담고 주소에서 바로 지운다. 서버 PC(localhost)는 키 없이 열린다. */
  var KK='cbAdminKey';
  function store(){ try{ return sessionStorage.getItem(KK) || localStorage.getItem(KK) || ''; }catch(e){ return ''; } }
  function setKey(k, keep){ try{ sessionStorage.setItem(KK, k); if(keep) localStorage.setItem(KK, k); else localStorage.removeItem(KK); }catch(e){} }
  function clearKey(){ try{ sessionStorage.removeItem(KK); localStorage.removeItem(KK); }catch(e){} }
  (function(){ var m=/(?:^|[#&])k=([^&]+)/.exec(location.hash||'');
    if(m){ setKey(decodeURIComponent(m[1]), false); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } } })();
  function getKey(){ return store(); }
  function hdr(extra){ var h=extra||{}; var k=getKey(); if(k) h['X-Admin-Key']=k; return h; }
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

  var counted=false;
  function load(){
    $('list').innerHTML=''; $('list').appendChild(el('div','msg','불러오는 중…'));
    fetch('api/feedback',{cache:'no-store',headers:hdr()}).then(function(r){
      if(r.status===403) return {ok:false, code:403};
      if(r.status===429) return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:false, code:429, err:j.err}; });   // 키를 여러 번 틀려 잠시 막힘
      return r.json().catch(function(){ return {ok:false, err: r.status===404||r.status===405||r.status===501 ? '이 서버에서는 의견 받기가 켜져 있지 않습니다' : '서버 응답 오류 ('+r.status+')'}; });
    }).then(function(j){
      if(j.code===403){ var had=!!getKey(); clearKey(); gate(had ? '키가 맞지 않습니다' : ''); return; }
      if(j.code===429){ clearKey(); gate(j.err || '키를 여러 번 틀려 잠시 막혔습니다'); return; }
      opened();
      if(!counted){ counted=true; post({action:'admin_view'}); }   // 접속 통계 — 키가 맞아 화면이 열렸을 때만 한 번 센다
      if(!j.ok){ items=[]; render(j.err||'볼 수 없는 주소입니다'); return; }
      items=j.items||[];
      render();
    }).catch(function(){ render('서버에 연결하지 못했습니다'); });
  }
  function filtered(ignoreSt){
    var k=$('kind').value, q=$('q').value.trim().toLowerCase();   /* 화면·관서는 의견에 붙이지 않는다(2026-11-12) */
    return items.filter(function(x){ if(k && (x.kind||'기타')!==k) return false;
      if(!ignoreSt && stFilter && (x.status||'대기')!==stFilter) return false;
      if(q){ var s=[x.text,x.who,x.station,x.page,x.note].join(' ').toLowerCase(); if(s.indexOf(q)<0) return false; } return true; });
  }
  /* 상태별 건수 — 구분·화면·검색 조건은 따르고 상태 조건만 뺀 개수 */
  function renderSum(){
    var S=$('sum'); S.innerHTML=''; var base=filtered(true), cnt={};
    base.forEach(function(x){ var s=x.status||'대기'; cnt[s]=(cnt[s]||0)+1; });
    [['', '전체', base.length]].concat(ST.map(function(s){ return [s[0], s[0], cnt[s[0]]||0]; })).forEach(function(r){
      var b=el('button'); b.type='button'; b.setAttribute('aria-pressed', stFilter===r[0]?'true':'false');
      b.appendChild(el('span',null,r[1])); b.appendChild(el('b',null,String(r[2])));
      b.onclick=function(){ stFilter=r[0]; render(); }; S.appendChild(b); });
  }
  function render(err){
    var L=$('list'); L.innerHTML='';
    if(err){ L.appendChild(el('div','msg',err)); $('count').textContent=''; $('sum').innerHTML=''; return; }
    renderSum();
    $('c-fb').textContent=items.length||'';
    var f=filtered(); $('count').textContent='전체 '+items.length+'건'+(f.length!==items.length?' · 보이는 '+f.length+'건':'');
    if(!f.length){ L.appendChild(el('div','msg', items.length ? '조건에 맞는 의견이 없습니다' : '아직 받은 의견이 없습니다')); return; }
    f.forEach(function(x){ L.appendChild(card(x)); });
  }
  function card(x){
    var st=x.status||'대기', it=el('div','item st-'+CLS[st]), m=el('div','meta');
    var kd=x.kind||'기타'; m.appendChild(el('span','k k-'+kd.split(' ')[0],kd));
    m.appendChild(el('span',null,x.ts||''));
    m.appendChild(el('span','who',x.who||'익명'));
    var badge=el('span','badge b-'+CLS[st],st); m.appendChild(badge);
    it.appendChild(m); it.appendChild(el('div','txt',x.text||''));

    /* 처리 — 상태를 고르고 처리 내용을 적어 저장 */
    var proc=el('div','proc'), seg=el('div','seg'), pick=st, btns=[];
    seg.appendChild(el('span','lb','처리'));
    ST.forEach(function(s){ var b=el('button','v-'+s[1],s[0]); b.type='button'; b.setAttribute('aria-pressed', s[0]===pick?'true':'false');
      b.onclick=function(){ pick=s[0]; btns.forEach(function(o){ o.setAttribute('aria-pressed', o.textContent===pick?'true':'false'); }); dirty(); };
      btns.push(b); seg.appendChild(b); });
    var db=el('button','del','🗑 삭제'); db.type='button'; db.title='이 의견을 완전히 지웁니다 (원본 파일에서도)';
    db.onclick=function(){
      var t=(x.text||'').replace(/\s+/g,' '); if(t.length>60) t=t.slice(0,60)+'…';
      if(!confirm('이 의견을 완전히 지울까요?\n\n「'+t+'」\n\n서버의 원본 파일(feedback.csv)에서도 지워지고 되살릴 수 없습니다.')) return;
      db.disabled=true; info.className='saved'; info.textContent='지우는 중…';
      fetch('api/feedback',{method:'POST',cache:'no-store',headers:hdr({'Content-Type':'application/json','X-Requested-With':'cbweather'}),
        body:JSON.stringify({action:'delete', id:x.id})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, err:'서버 응답 오류 ('+r.status+')'}; }); })
      .then(function(j){
        if(!j.ok){ db.disabled=false; info.className='saved err'; info.textContent=j.err||'지우지 못했습니다'; return; }
        items=items.filter(function(o){ return o!==x; }); render();
      }).catch(function(){ db.disabled=false; info.className='saved err'; info.textContent='서버에 연결하지 못했습니다'; });
    };
    seg.appendChild(db);
    var row=el('div','note'), ta=el('textarea'); ta.maxLength=500; ta.rows=1; ta.value=x.note||'';
    ta.placeholder='어떻게 처리했는지 간단히 (예: 11/12 지도 글자 크기 조정 반영 · 공지사항 안내)';
    var save=el('button','save','저장'); save.type='button'; save.disabled=true;
    var info=el('div','saved', x.statusAt ? '마지막 저장 '+x.statusAt : '');
    function dirty(){ save.disabled = (pick===(x.status||'대기') && ta.value.trim()===(x.note||'')); }
    ta.oninput=dirty;
    ta.onkeydown=function(e){ if((e.ctrlKey||e.metaKey) && e.key==='Enter' && !save.disabled) save.click(); };
    save.onclick=function(){
      save.disabled=true; info.className='saved'; info.textContent='저장 중…';
      fetch('api/feedback',{method:'POST',cache:'no-store',headers:hdr({'Content-Type':'application/json','X-Requested-With':'cbweather'}),
        body:JSON.stringify({action:'status', id:x.id, status:pick, note:ta.value.trim()})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, err:'서버 응답 오류 ('+r.status+')'}; }); })
      .then(function(j){
        if(!j.ok){ info.className='saved err'; info.textContent=j.err||'저장하지 못했습니다'; dirty(); return; }
        x.status=j.status||pick; x.note=j.note||''; x.statusAt=j.at||'';
        it.className='item st-'+CLS[x.status]; badge.className='badge b-'+CLS[x.status]; badge.textContent=x.status;
        info.textContent='저장했습니다'+(x.statusAt?' · '+x.statusAt:''); dirty(); renderSum();
      }).catch(function(){ info.className='saved err'; info.textContent='서버에 연결하지 못했습니다'; dirty(); });
    };
    row.appendChild(ta); row.appendChild(save);
    proc.appendChild(seg); proc.appendChild(row); proc.appendChild(info);
    it.appendChild(proc);
    return it;
  }
  function csv(){
    var cell=function(v){ v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };   /* 엑셀 수식 실행 방지 */
    var rows=[['시각','구분','화면','관서','부서·이름','내용','처리 상태','처리 내용','처리 시각']].concat(filtered().map(function(x){
      return [x.ts,x.kind||'기타',x.page,x.station,x.who||'익명',x.text,x.status||'대기',x.note||'',x.statusAt||'']; }));
    var b=new Blob(['﻿'+rows.map(function(r){ return r.map(cell).join(','); }).join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='의견_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  $('kind').onchange=function(){ render(); }; $('q').oninput=function(){ render(); };
  $('reload').onclick=load; $('csv').onclick=csv;
  /* 키 입력 화면 */
  function gate(msg){ $('main').hidden=true; $('gate').hidden=false; $('logout').hidden=true; $('gerr').textContent=msg||''; $('gkey').value=''; $('gkey').focus(); }
  function opened(){ $('gate').hidden=true; $('main').hidden=false; $('logout').hidden=!store(); }
  $('gate').onsubmit=function(e){ e.preventDefault(); var k=$('gkey').value.trim(); if(!k){ $('gerr').textContent='키를 넣으세요'; return; }
    setKey(k, $('gkeep').checked); $('gerr').textContent='확인 중…'; load(); };
  $('logout').onclick=function(){ clearKey(); gate('키를 지웠습니다'); };
  load();

  /* ── 탭 ── */
  function tab(t){
    ['fb','nt','sr','ac'].forEach(function(k){ $('pane-'+k).hidden = k!==t; $('tb-'+k).setAttribute('aria-selected', k===t?'true':'false'); });
    try{ sessionStorage.setItem('cbAdminTab', t); }catch(e){}
  }
  $('tb-fb').onclick=function(){ tab('fb'); }; $('tb-nt').onclick=function(){ tab('nt'); };
  $('tb-ac').onclick=function(){ tab('ac'); acLoad(); };
  $('tb-sr').onclick=function(){ tab('sr'); if(!SR.rules) srLoad(); };
  try{ var _t=sessionStorage.getItem('cbAdminTab'); if(_t==='nt') tab(_t); if(_t==='ac'){ tab('ac'); acLoad(); } if(_t==='sr'||_t==='dt'){ tab('sr'); srLoad(); } }catch(e){}

  /* ── 비상단계 · 근무(2026-11-23) ── 대상(소방본부·119종합상황실)마다 단계별 근무 내용 + 그 단계가 되는 조건.
     근무 = 서버 .data/duty.json(없으면 duty.js 기본값) · 조건 = .data/stage_rules.json(없으면 재대본 표). 계산은 stage.js(cbStage)와 같은 코드.
     조건: 단계마다 조건 묶음 목록 — 묶음끼리 '또는', 묶음 안 '그리고'.
     ▶ 관서로 넓힐 때: stage.js 의 TARGETS 에 'office:제천': '제천소방서' 처럼 한 줄을 더하면 이 화면·저장·계산이 그 대상을 그대로 다룬다
       (근무 줄은 대상 이름으로 찾고, 없으면 새로 만든다). */
  var SR={ rules:null, duty:null, cur:'hq', dirty:false, at:'', v:{rain:{p:0,a:3,w:0},snow:{},ty:{},tyInfo:false} };   // v = 미리 보기 가상 숫자(처음엔 호우주의보 3개 시·군)
  var SR_ST=[{r:1,pill:'준비',name:'준비 단계',col:'#2563eb'},{r:2,pill:'1단계',name:'주의',col:'#ca8a04'},{r:3,pill:'2단계',name:'경계',col:'#ea580c'},{r:4,pill:'3단계',name:'심각',col:'#dc2626'}];
  function srClone(o){ return JSON.parse(JSON.stringify(o)); }
  function srT(id){ var t=SR.rules.targets[id]; if(!t){ t=SR.rules.targets[id]={mode:'table'}; } return t; }
  var SR_DK=['s1','s2','s3','s4','snow'], SR_DD=(window.cbDuty&&window.cbDuty.DEFAULT)||{rows:[]};
  function srLoad(){
    $('srBody').innerHTML='<div class="msg">불러오는 중…</div>';
    var J=function(u){ return fetch(u,{cache:'no-store'}).then(function(r){ return r.json(); }); };
    Promise.all([J('api/feedback?stage=1'), J('api/feedback?duty=1')]).then(function(a){
      var j=a[0], d=a[1];
      if(!j||!j.ok||!d||!d.ok){ $('srBody').innerHTML='<div class="msg">불러오지 못했습니다</div>'; return; }
      if(!('rules' in j)){ $('srBody').innerHTML='<div class="msg">서버가 아직 예전 버전입니다 — 서버.bat 을 껐다 켠 뒤 다시 보세요</div>'; return; }
      SR.rules=j.rules?srClone(j.rules):{targets:{}}; SR.duty=srClone((d.duty&&d.duty.rows&&d.duty.rows.length?d.duty:SR_DD).rows);
      var at=[(j.rules&&j.rules.at)||'', (d.duty&&d.duty.at)||''].sort().pop(); SR.at=at; SR.dirty=false;
      Object.keys(window.cbStage.TARGETS).forEach(function(id){ srT(id); srDuty(id); }); srDraw();
    }).catch(function(){ $('srBody').innerHTML='<div class="msg">서버에 연결하지 못했습니다</div>'; });
  }

      var el=$('acErr'); if(!el) return;
      if(!j||!j.ok){ el.textContent=(j&&j.err)||'불러오지 못했습니다'; return; }
      if(!j.items.length){ el.textContent='기록된 오류 없음'; return; }
      el.innerHTML='<table class="ac-t"><tr><th>시각</th><th>화면</th><th>오류</th><th>위치</th></tr>'+j.items.map(function(x){ return '<tr><td>'+esc(x.ts)+'</td><td>'+esc(x.page)+'</td><td title="'+esc(x.stack||'')+'">'+esc(x.msg)+'</td><td>'+esc((x.src||'').split('/').pop()+(x.line?':'+x.line:''))+'</td></tr>'; }).join('')+'</table>';
    }).catch(function(){ var el=$('acErr'); if(el) el.textContent='서버에 연결하지 못했습니다'; });
  }
  var AC_NEW='2026-11-23';   /* 이날부터 '화면이 3초 넘게 보였을 때만' 센다 — 그 앞 날은 흐리게(실제보다 많음) */
  function acDraw(all){
    acLast=all;
    var by=all.by||null, split=acDev==='all'&&by, j=(acDev!=='all'&&by&&by[acDev])||all;
    var P=by&&by.PC, M=by&&by['휴대폰'], today=all.at.slice(0,10);
    $('acAt').textContent=all.at+' 기준'+(acDev!=='all'&&!by?' · 서버가 예전 버전이라 기기별로 못 나눕니다(서버.bat 다시 켜기)':'');
    function pg(set,name){ return (set.pages||[]).filter(function(p){ return p.page===name; })[0]; }
    function card(t,k){
      var o=j[k], h='<div class="ac-c"><span>'+t+'</span><b>'+o.visitors+'<small>명</small></b>';
      if(o['new']!=null) h+='<em>처음 온 '+o['new']+'명 · 다시 온 '+(o.visitors-o['new'])+'명</em>';
      if(split) h+='<em>PC '+P[k].visitors+'명 · 휴대폰 '+M[k].visitors+'명</em>';
      return h+'<em class="d">화면 열기 '+o.views+'회</em></div>';
    }
    function cell(p,k){
      var a=split&&pg(P,p.page), b=split&&pg(M,p.page);
      return '<td class="n" title="화면 열기 '+p[k].views+'회">'+p[k].visitors+'명'+(split?'<small>PC '+(a?a[k].visitors:0)+' · 휴대폰 '+(b?b[k].visitors:0)+'</small>':'')+'</td>';
    }
    /* 막대 — segs 는 아래에서 위로 [PC, 휴대폰] 또는 [값] */
    function bars(items, mx){
      return '<div class="ac-bars">'+items.map(function(it){
        var tot=it.segs.reduce(function(s,x){ return s+x.v; },0), h='';
        it.segs.slice().reverse().forEach(function(x){ if(x.v) h+='<i'+(x.c?' class="'+x.c+'"':'')+' style="height:'+Math.max(2,Math.round(x.v/mx*96))+'px"></i>'; });
        return '<div class="'+(it.cls||'')+'" title="'+esc(it.tip)+'"><div class="col">'+(tot?'<em>'+tot+'</em>':'')+h+'</div><span'+(it.k?' class="k"':'')+'>'+it.lb+'</span></div>';
      }).join('')+'</div>';
    }
    var dmx=Math.max.apply(null, j.daily.map(function(d){ return d.visitors; }).concat([1]));
    var daily=bars(j.daily.map(function(d,i){
      var pc=split?P.daily[i].visitors:0, mb=split?M.daily[i].visitors:0;
      return { lb:(+d.date.slice(8)), k:(+d.date.slice(8))%5===0||d.date===today, cls:(d.date<AC_NEW?'old ':'')+(d.date===today?'today':''),
        segs: split? [{v:pc},{v:mb,c:'m'}] : [{v:d.visitors}],
        tip: d.date+' · 방문자 '+d.visitors+'명'+(split?' (PC '+pc+' · 휴대폰 '+mb+')':'')+(d['new']!=null?' · 처음 온 '+d['new']+'명':'')+' · 화면 열기 '+d.views+'회'+(d.date<AC_NEW?' · 예전 방식':'') };
    }), dmx);
    var hmx=Math.max.apply(null, j.hours.concat([1]));
    var hourly=bars(j.hours.map(function(n,h){ return {lb:h, k:h%3===0, segs:[{v:n}], tip:h+'시 · 화면 열기 '+n+'회'}; }), hmx);
    /* 브라우저 — 11-23 부터 기록. 7일 많은 순 */
    var bt=(j.browsers&&j.browsers.today)||{}, b7=(j.browsers&&j.browsers.d7)||{};
    var names=Object.keys(b7).filter(function(n){ return n!=='기록 전'; }).sort(function(x,y){ return b7[y]-b7[x]; });
    var bmx=Math.max.apply(null, names.map(function(n){ return b7[n]; }).concat([1]));
    var brw=names.length? '<div class="ac-br">'+names.map(function(n){
      return '<span>'+esc(n)+'</span><span class="tr"><i style="width:'+Math.round(b7[n]/bmx*100)+'%"></i></span><span class="v">오늘 '+(bt[n]||0)+' · 7일 '+b7[n]+'명</span>';
    }).join('')+'</div>' : '<div class="ac-note">11월 23일부터 기록합니다. 서버를 다시 켠 뒤 접속이 생기면 나옵니다.</div>';
    var who=acDev==='all'?'':' <small>'+acDev+'</small>';
    var lg=split?'<span class="ac-lg"><span><i style="background:var(--brand)"></i>PC</span><span><i style="background:#f59e0b"></i>휴대폰</span></span>':'';
    $('acBody').classList.toggle('mob', acDev==='휴대폰');
    $('acBody').innerHTML=
      '<div class="ac-cards">'+card('오늘','today')+card('최근 7일','d7')+card('최근 30일','d30')+'</div>'
      +'<div class="ac-box"><h3>날짜별 방문자'+who+lg+'<small>흐린 막대 = 11월 23일 이전(예전 방식이라 실제보다 많음)</small></h3>'+daily+'</div>'
      +'<div class="ac-two">'
        +'<div class="ac-box"><h3>화면별 방문자'+who+'</h3><div class="ac-tw"><table class="ac-t"><tr><th>화면</th><th class="n">오늘</th><th class="n">7일</th><th class="n">30일</th></tr>'
        +(j.pages.length? j.pages.map(function(p){ return '<tr><td>'+esc(p.page)+'</td>'+cell(p,'today')+cell(p,'d7')+cell(p,'d30')+'</tr>'; }).join('') : '<tr><td colspan="4">아직 기록이 없습니다</td></tr>')+'</table></div></div>'
        +'<div class="ac-box"><h3>브라우저별 방문자'+who+'<small>최근 7일</small></h3>'+brw+'</div>'
      +'</div>'
      +'<div class="ac-box"><h3>시간대별 화면 열기'+who+'<small>최근 7일 · 몇 시에 많이 보나</small></h3>'+hourly+'</div>'
      +'<div class="ac-box"><h3>화면 오류<small>최근 50건</small></h3><div id="acErr" class="ac-note">불러오는 중…</div></div>'
      +'<details class="ac-how"><summary>어떻게 세나요?</summary><ul>'
        +'<li><b>방문자</b> = 같은 기기·같은 브라우저를 한 명으로 셉니다. 휴대폰 주소가 바뀌어도 같은 사람입니다. 카톡 안 브라우저와 크롬처럼 브라우저가 다르면 따로 셉니다.</li>'
        +'<li><b>화면 열기</b> = 화면이 실제로 3초 넘게 보였을 때 1회입니다. 메일 보안 검사·링크 미리보기처럼 열어 보고 바로 닫는 접속은 빠집니다. 자료 갱신(1분마다)은 세지 않습니다.</li>'
        +'<li><b>처음 온 / 다시 온</b> = 그 기간 앞 30일 기록에 없던 방문자가 \'처음 온\' 사람입니다.</li>'
        +'<li>켜 둔 채 날이 바뀐 화면(상황판 PC 등)은 다음 날 1명으로 다시 셉니다.</li>'
        +'<li>11월 22일 이전 기록은 휴대폰 한 사람이 여러 명으로, 11월 23일 이전은 메일 검사 같은 자동 접속이 섞여 실제보다 많습니다.</li>'
        +'<li>IP 주소는 저장하지 않습니다. 서버를 켜 둔 동안만 기록되고, 13개월 보관합니다.</li>'
      +'</ul></details>';
  }

  /* ── 공지사항 ── 공지는 서버(.data/notices.json)에만 있다. 쓰기·고치기·지우기 모두 여기서 하고 서버에 id 로 저장 */
  var NK=['새 기능','개선','오류 수정','안내'], over=[], N=window.cbNotices||{base:[], merge:function(){ return []; }};
  function pad(n){ return (n<10?'0':'')+n; }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function newId(date){   /* 날짜-시분(예 2026-11-12-1430) — 같은 분에 또 쓰면 뒤에 a·b… */
    var d=new Date(), id=date+'-'+pad(d.getHours())+pad(d.getMinutes()), all={}, k=0;
    (N.base||[]).concat(over).forEach(function(n){ all[n.id]=1; });
    var base=id; while(all[id]){ id=base+'abcdefghijklmnopqrstuvwxyz'.charAt(k++); }
    return id;
  }
  function ntLoad(){
    $('ntList').innerHTML=''; $('ntList').appendChild(el('div','msg','불러오는 중…'));
    fetch('api/feedback?notices=1',{cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){ over=(j && j.ok && j.items) || []; ntRender(); })
      .catch(function(){ over=[]; ntRender('서버에 연결하지 못했습니다'); });
  }
  function ntRender(warn){
    var L=$('ntList'); L.innerHTML='';
    if(warn) L.appendChild(el('div','msg',warn));
    var list=N.merge(over);
    $('c-nt').textContent=list.length; $('ntCount').textContent='보이는 공지 '+list.length+'건';
    if(!list.length) L.appendChild(el('div','msg','공지가 없습니다. ＋ 새 공지 쓰기로 올리세요.'));
    list.forEach(function(n){
      var c=el('div','nt'), h=el('div','h');
      h.appendChild(el('span','pill p-'+String(n.kind||'안내').split(' ')[0], n.kind||'안내'));
      h.appendChild(el('span',null,n.date||''));
      if(n.from) h.appendChild(el('span',null,'· '+n.from));
      if(n.at) h.appendChild(el('span','src','저장 '+n.at));
      var acts=el('span','acts'), e=el('button',null,'고치기'), d=el('button','del','지우기');
      e.type=d.type='button'; e.onclick=function(){ ntEdit(n); }; d.onclick=function(){ ntDel(n); };
      acts.appendChild(e); acts.appendChild(d); h.appendChild(acts);
      c.appendChild(h); c.appendChild(el('h3',null,n.title||'')); c.appendChild(el('div','b',n.body||''));
      L.appendChild(c);
    });
  }
  function post(body){
    return fetch('api/feedback',{method:'POST',cache:'no-store',headers:hdr({'Content-Type':'application/json','X-Requested-With':'cbweather'}),body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {ok:false, err:'서버 응답 오류 ('+r.status+')'}; }); })
      .catch(function(){ return {ok:false, err:'서버에 연결하지 못했습니다'}; });
  }
  function ntEdit(n){
    var isNew=!n; n=n||{date:today(), kind:'안내', title:'', body:'', from:''};
    var E=$('ntEd'); E.innerHTML=''; var f=el('div','ed');
    f.appendChild(el('b',null, isNew?'새 공지':'공지 고치기'));
    var r1=el('div','r'), kd=el('select'), dt=el('input'), fr=el('input');
    NK.forEach(function(k){ var o=el('option',null,k); o.value=k; kd.appendChild(o); }); kd.value=n.kind||'안내';
    dt.type='date'; dt.value=n.date||today(); fr.placeholder='출처(선택) 예: 의견 반영'; fr.maxLength=40; fr.value=n.from||'';
    r1.appendChild(el('label',null,'구분')); r1.appendChild(kd); r1.appendChild(el('label',null,'날짜')); r1.appendChild(dt); r1.appendChild(fr);
    var ti=el('input'); ti.placeholder='제목 (예: 🔥 산불 위험도에 전국 지도가 붙었습니다)'; ti.maxLength=100; ti.value=n.title||'';
    var bd=el('textarea'); bd.placeholder='내용 — 줄바꿈 그대로 보입니다'; bd.maxLength=3000; bd.value=n.body||'';
    var r2=el('div','r'), ok=el('button','go', isNew?'올리기':'저장'), no=el('button',null,'취소'), er=el('span','err');
    ok.type=no.type='button';
    no.onclick=function(){ E.innerHTML=''; };
    ok.onclick=function(){
      if(ti.value.trim().length<2){ er.textContent='제목을 적어 주세요'; return; }
      ok.disabled=true; er.textContent='저장 중…';
      var item={id: isNew ? newId(dt.value||today()) : n.id, date:dt.value||today(), kind:kd.value, title:ti.value.trim(), body:bd.value.trim(), from:fr.value.trim()};
      post({action:'notice_save', item:item}).then(function(j){
        ok.disabled=false;
        if(!j.ok){ er.textContent=j.err||'저장하지 못했습니다'; return; }
        E.innerHTML=''; ntLoad();
      });
    };
    r2.appendChild(ok); r2.appendChild(no); r2.appendChild(er);
    f.appendChild(r1); f.appendChild(ti); f.appendChild(bd); f.appendChild(r2);
    E.appendChild(f); ti.focus(); window.scrollTo(0, E.offsetTop-10);
  }
  function ntDel(n){
    if(!confirm('이 공지를 지울까요?\n\n「'+(n.title||'')+'」\n\n모든 화면의 공지사항에서 사라집니다.')) return;
    post({action:'notice_delete', id:n.id}).then(function(j){ if(!j.ok){ alert(j.err||'지우지 못했습니다'); return; } ntLoad(); });
  }
  $('ntNew').onclick=function(){ ntEdit(null); }; $('ntReload').onclick=ntLoad;
  ntLoad();

  /* ── 비상단계 지정 번호 ── */
  function pinMsg(t, cls){ var m=$('pinMsg'); m.className='dt-msg'+(cls?' '+cls:''); m.textContent=t||''; }
  function pinLoad(){ fetch('api/feedback?stage=1',{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ pinMsg(!j||!j.ok ? '서버에서 읽지 못했습니다' : (j.pin ? '번호가 정해져 있습니다' : '아직 번호가 없습니다 — 번호를 정해야 상황실 화면에서 지정할 수 있습니다'), (!j||!j.ok)?'err':''); })
    .catch(function(){ pinMsg('서버에 연결하지 못했습니다','err'); }); }
  function pinErr(j, fallback){ var e=(j&&j.err)||fallback; return /내용을 적어/.test(e) ? '서버가 아직 예전 버전입니다 — 서버.bat 을 껐다 켠 뒤 다시 하세요' : e; }
  $('pinSave').onclick=function(){ var v=$('pinIn').value.trim(); if(!/^\d{7}$/.test(v)){ pinMsg('숫자 7자리로 넣어 주세요','err'); return; }
    post({action:'stage_pin', pin:v}).then(function(j){ if(!j.ok){ pinMsg(pinErr(j,'저장하지 못했습니다'),'err'); return; } $('pinIn').value=''; pinMsg('번호를 저장했습니다','ok'); }); };
  $('pinDel').onclick=function(){ if(!confirm('비상단계 지정 번호를 지울까요?\n지우면 상황실 화면에서 단계를 지정할 수 없습니다.')) return;
    post({action:'stage_pin', pin:null}).then(function(j){ if(!j.ok){ pinMsg(pinErr(j,'지우지 못했습니다'),'err'); return; } pinMsg('번호를 지웠습니다 — 상황실 화면에서 지정할 수 없습니다','ok'); }); };
  pinLoad();
})();
</script>
</body></html>
