<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의견함 · 상황판</title>
<style>
  :root{ --bg:#eef1f7; --card:#fff; --ink:#0f1b2d; --ink2:#4b5a74; --ink3:#8593aa; --bd:#e4e9f2; --brand:#2563eb; --warn:#ef6c1a; --sev:#d42a2f; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:20px 16px 40px; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--ink2); margin-bottom:14px; line-height:1.6; }
  .bar{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .bar button{ padding:7px 12px; border-radius:9px; border:1px solid var(--bd); background:var(--card); color:var(--ink2); font:800 12.5px inherit; cursor:pointer; }
  .bar button.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .item{ background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--ink3); margin-bottom:6px; }
  .tag{ font-weight:900; color:#fff; padding:2px 8px; border-radius:6px; font-size:11.5px; }
  .text{ font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .empty{ color:var(--ink3); padding:30px 0; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💬 의견함</h1>
  <div class="sub">직원들이 상황판의 💬 버튼으로 보낸 오류 신고·기능 개선 의견입니다(최신 순). 원본은 서버 PC의 <code>feedback/feedback.jsonl</code> 에 쌓입니다.<br>
    이 페이지는 <b>서버를 띄운 PC에서만</b> 열립니다(다른 PC에서는 목록이 보이지 않습니다).</div>
  <div class="bar" id="bar"></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</div>
<script>
(function(){
  var COLOR = { '오류 신고':'var(--sev)', '기능 개선':'var(--brand)', '기타':'var(--ink3)' };
  var all = [], filter = '전체';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function draw(){
    var bar = document.getElementById('bar'); bar.innerHTML = '';
    ['전체','오류 신고','기능 개선','기타'].forEach(function(k){
      var n = k==='전체' ? all.length : all.filter(function(x){ return x.kind===k; }).length;
      var b = document.createElement('button'); b.textContent = k+' '+n; if(k===filter) b.className='on';
      b.onclick = function(){ filter = k; draw(); }; bar.appendChild(b);
    });
    var list = all.filter(function(x){ return filter==='전체' || x.kind===filter; });
    document.getElementById('list').innerHTML = list.length ? list.map(function(x){
      return '<div class="item"><div class="head"><span class="tag" style="background:'+(COLOR[x.kind]||'var(--ink3)')+'">'+esc(x.kind)+'</span>'
        + '<span>'+esc(x.received||'')+'</span><span>'+esc(x.name||'이름 없음')+'</span><span>'+esc(x.page||'')+(x.station?' · '+esc(x.station):'')+'</span>'
        + '<span>'+esc(x.ip||'')+'</span></div><div class="text">'+esc(x.text)+'</div></div>';
    }).join('') : '<div class="empty">아직 받은 의견이 없습니다.</div>';
  }
  fetch('api/feedback', {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ all = (j.items||[]).slice().reverse(); draw(); })
    .catch(function(){ document.getElementById('list').innerHTML = '<div class="empty">목록을 불러올 수 없습니다. 서버를 띄운 PC에서 열어 주세요(로컬서버.bat / 내부망서버.bat).</div>'; });
})();
</script>
</body>
</html>
